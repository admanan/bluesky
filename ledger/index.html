<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>โปรแกรมบัญชีแยกประเภท</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--pri:#2563eb;--pri-d:#1d4ed8;--link:#2563eb;--ok:#16a34a;--bad:#dc2626;--hd:#eef2ff;--soft:#f8fafc;--okbg:#dcfce7;--badbg:#fee2e2;--ibd:#cbd5e1;--focus:#93c5fd;--rule:#94a3b8;--toast:#111827;--toastfg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--ink:#e5e7eb;--mute:#94a3b8;--line:#334155;--link:#7aa7ff;--ok:#4ade80;--bad:#f87171;--hd:#27344f;--soft:#172033;--okbg:#14391f;--badbg:#4a1d1d;--ibd:#475569;--focus:#3b82f6;--rule:#64748b;--toast:#e5e7eb;--toastfg:#111827;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--ink:#e5e7eb;--mute:#94a3b8;--line:#334155;--link:#7aa7ff;--ok:#4ade80;--bad:#f87171;--hd:#27344f;--soft:#172033;--okbg:#14391f;--badbg:#4a1d1d;--ibd:#475569;--focus:#3b82f6;--rule:#64748b;--toast:#e5e7eb;--toastfg:#111827;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:600}
header input{padding:5px 8px;border-radius:6px;border:0;min-width:200px}
nav{display:flex;gap:2px;background:var(--card);border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{border:0;background:none;padding:12px 14px;cursor:pointer;font:inherit;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--link);border-color:var(--pri);font-weight:600}
main{max-width:1000px;margin:16px auto;padding:0 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:17px}
h3{margin:16px 0 6px;font-size:15px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal textarea{height:200px;font-family:ui-monospace,monospace;font-size:12px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
body.inviewer .printbtn{display:none}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--ibd);border-radius:6px;background:var(--card);color:inherit;width:100%}
input:focus,select:focus{outline:2px solid var(--focus);border-color:var(--pri)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.row>div{flex:1;min-width:140px}
.row>div.w2{flex:2;min-width:220px}
button.btn{background:var(--pri);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}
button.btn:hover{background:var(--pri-d)}
button.btn.sec{background:var(--card);color:var(--link);border:1px solid var(--link)}
button.btn.red{background:var(--bad)}
button.lnk{background:none;border:0;color:var(--link);cursor:pointer;font:inherit;padding:2px 6px}
button.lnk.red{color:var(--bad)}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--hd);font-weight:600;font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;border-top:2px solid var(--rule);background:var(--soft)}
tr.sub td{font-weight:600;background:var(--soft)}
.lines td{padding:3px;border:0}
.lines input{padding:6px 7px}
.lines th{border:0}
.bal{padding:8px 12px;border-radius:6px;font-weight:600;display:inline-block}
.bal.ok{background:var(--okbg);color:var(--ok)}
.bal.bad{background:var(--badbg);color:var(--bad)}
.mute{color:var(--mute);font-size:13px}
.entry{border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.entry .eh{background:var(--hd);padding:8px 10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.entry table td{border-bottom:1px dashed var(--line)}
.ind{padding-left:28px!important}
.center{text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--toast);color:var(--toastfg);padding:10px 18px;border-radius:8px;z-index:50}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}.card{border:0;padding:0}main{margin:0;max-width:none}.pt{display:block!important}}
.pt{display:none;text-align:center;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <h1>📒 โปรแกรมบัญชีแยกประเภท</h1>
  <input id="company" placeholder="ชื่อกิจการ" oninput="S.company=this.value;save()">
</header>
<nav id="nav"></nav>
<main id="main"></main>
<datalist id="accts"></datalist>
<datalist id="tpls"></datalist>

<script>
/* ---------- กล่องโต้ตอบในหน้า (ใช้แทน confirm/prompt ที่บางสภาพแวดล้อมไม่รองรับ) ---------- */
function dlg(msg,o){
  o=o||{};
  return new Promise(res=>{
    const el=document.createElement('div'); el.className='modal'; el.id='dlg';
    el.innerHTML=`<div class="box" role="dialog" aria-modal="true"><p style="margin:0 0 10px;white-space:pre-line">${esc(msg)}</p>
      ${o.text!=null?`<textarea id="dlgTx" ${o.readonly?'readonly':''} placeholder="${esc(o.ph||'')}">${esc(o.text)}</textarea>`:''}
      ${o.input?`<input id="dlgIn" value="${esc(o.def||'')}">`:''}
      <div class="acts">${(o.extra||[]).map((b,i)=>`<button class="btn sec" data-x="${i}">${esc(b[0])}</button>`).join('')}
      ${o.noCancel?'':'<button class="btn sec" data-c="1">ยกเลิก</button>'}<button class="btn" data-ok="1">${esc(o.ok||'ตกลง')}</button></div></div>`;
    const done=v=>{ el.remove(); res(v); };
    el.addEventListener('click',ev=>{
      const b=ev.target.closest('button'); if(ev.target===el&&!o.noCancel) return done(null); if(!b) return;
      if(b.dataset.ok) return done(o.input?$('dlgIn').value:o.text!=null&&!o.readonly?$('dlgTx').value:true);
      if(b.dataset.c) return done(null);
      if(b.dataset.x!=null) o.extra[+b.dataset.x][1](el);
    });
    el.addEventListener('keydown',ev=>{
      if(ev.key==='Escape'){ ev.preventDefault(); done(o.noCancel?true:null); }
      else if(ev.key==='Enter'&&ev.target.tagName!=='TEXTAREA'&&ev.target.tagName!=='BUTTON'){ ev.preventDefault(); el.querySelector('[data-ok]').click(); }
    });
    document.body.appendChild(el);
    (o.input?$('dlgIn'):o.text!=null?$('dlgTx'):el.querySelector('[data-ok]')).focus();
    if(o.input) $('dlgIn').select(); else if(o.text!=null&&o.readonly) $('dlgTx').select();
  });
}
const askConfirm=m=>dlg(m).then(v=>v!==null);
const askPrompt=(m,d)=>dlg(m,{input:true,def:d});
function copyText(el){ const t=el.querySelector('textarea'); t.select(); (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('คัดลอกแล้ว'),()=>{ document.execCommand&&document.execCommand('copy'); toast('เลือกข้อความแล้ว กด Ctrl+C เพื่อคัดลอก'); }); }
// ส่งออกข้อมูล: แสดงให้คัดลอก และลองดาวน์โหลดเป็นไฟล์ (บางสภาพแวดล้อมดาวน์โหลดไม่ได้)
function exportText(title,name,text,type){
  return dlg(title,{text,readonly:true,noCancel:true,ok:'ปิด',extra:[['📋 คัดลอก',copyText],['⬇ ดาวน์โหลดไฟล์',()=>download(name,text,type)]]});
}

/* ---------- ข้อมูล ---------- */
const KEY = 'ledger-app-v1';
const TYPES = {A:'สินทรัพย์', L:'หนี้สิน', E:'ส่วนของเจ้าของ', R:'รายได้', X:'ค่าใช้จ่าย'};
const DEBIT_NORMAL = {A:true, X:true, L:false, E:false, R:false};

function defaultTemplates(){
  return [
    ['ขายสินค้าเงินสด','RV',[['1100','dr'],['4100','cr']]],
    ['ขายเชื่อ','SV',[['1200','dr'],['4100','cr']]],
    ['รับชำระหนี้จากลูกหนี้','RV',[['1100','dr'],['1200','cr']]],
    ['ซื้อสินค้าเงินสด','PV',[['1300','dr'],['1100','cr']]],
    ['จ่ายค่าเช่า','PV',[['5300','dr'],['1100','cr']]],
    ['จ่ายเงินเดือน','PV',[['5200','dr'],['1100','cr']]],
    ['จ่ายค่าน้ำ ค่าไฟ ค่าโทรศัพท์','PV',[['5400','dr'],['1100','cr']]],
    ['นำเงินสดฝากธนาคาร','JV',[['1110','dr'],['1100','cr']]],
    ['เจ้าของนำเงินมาลงทุน','RV',[['1100','dr'],['3100','cr']]]
  ].map(([name,bookId,l])=>({name,bookId,desc:name,lines:l.map(([code,side])=>({code,side,note:'',fixed:0}))}));
}
function defaults(){
  return {
    company:'',
    accounts:[
      ['1100','เงินสด','A'],['1110','เงินฝากธนาคาร','A'],['1200','ลูกหนี้การค้า','A'],
      ['1300','สินค้าคงเหลือ','A'],['1500','อุปกรณ์สำนักงาน','A'],
      ['2100','เจ้าหนี้การค้า','L'],['2300','เงินกู้ยืม','L'],
      ['3100','ทุน','E'],['3200','ถอนใช้ส่วนตัว','E'],
      ['4100','รายได้จากการขาย/บริการ','R'],['4900','รายได้อื่น','R'],
      ['5100','ต้นทุนขาย','X'],['5200','เงินเดือนและค่าแรง','X'],['5300','ค่าเช่า','X'],
      ['5400','ค่าน้ำ ค่าไฟ ค่าโทรศัพท์','X'],['5900','ค่าใช้จ่ายอื่น','X']
    ].map(a=>({code:a[0],name:a[1],type:a[2]})),
    books:[
      {id:'JV',name:'สมุดรายวันทั่วไป'},{id:'RV',name:'สมุดรายวันรับเงิน'},
      {id:'PV',name:'สมุดรายวันจ่ายเงิน'},{id:'SV',name:'สมุดรายวันขาย'},{id:'PU',name:'สมุดรายวันซื้อ'}
    ],
    templates:defaultTemplates(),
    entries:[]
  };
}
function load(){
  try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.accounts){ if(!d.templates) d.templates=defaultTemplates().filter(t=>t.lines.every(l=>d.accounts.some(a=>a.code===l.code))&&d.books.some(b=>b.id===t.bookId)); return d; } }catch(e){}
  return defaults();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('บันทึกลงเครื่องไม่ได้'); } }
let S = load();

/* ---------- ตัวช่วย ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sat = v => Math.round((parseFloat(v)||0)*100);           // เก็บเป็นสตางค์ เลี่ยงทศนิยมเพี้ยน
const money = s => (s/100).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const mz = s => s ? money(s) : '';
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtDate = s => { if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}/${m}/${+y+543}`; };
const acc = code => S.accounts.find(a=>a.code===code);
const accName = code => { const a=acc(code); return a? `${a.code} ${a.name}` : code; };
const book = id => S.books.find(b=>b.id===id);
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function sortedEntries(){ return [...S.entries].sort((a,b)=>a.date.localeCompare(b.date)||a.docNo.localeCompare(b.docNo)); }
function download(name, text, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }

function nextDocNo(bookId, date){
  const b=book(bookId); if(!b) return '';
  const [y,m]=(date||today()).split('-');
  const pre = `${b.id}-${String((+y+543)%100).padStart(2,'0')}${m}-`;
  let max=0;
  S.entries.forEach(e=>{ if(e.docNo.startsWith(pre)){ const n=parseInt(e.docNo.slice(pre.length)); if(n>max) max=n; } });
  return pre + String(max+1).padStart(3,'0');
}

/* ---------- ยอดคงเหลือ ---------- */
// คืนค่า {code:{dr,cr}} ของรายการที่ from <= date <= to (ค่าว่างคือไม่จำกัด)
function totals(from, to){
  const t={};
  S.entries.forEach(e=>{
    if(from && e.date<from) return;
    if(to && e.date>to) return;
    e.lines.forEach(l=>{ const o=t[l.code]||(t[l.code]={dr:0,cr:0}); o.dr+=l.dr; o.cr+=l.cr; });
  });
  return t;
}
// ยอดคงเหลือตามด้านปกติของบัญชี (ติดลบ = ผิดด้าน)
function natBal(a, o){ o=o||{dr:0,cr:0}; return DEBIT_NORMAL[a.type] ? o.dr-o.cr : o.cr-o.dr; }

/* ---------- ช่วงเวลา (ใช้ร่วมกันทุกรายงาน) ---------- */
let period = { from: new Date().getFullYear()+'-01-01', to: today() };
function periodBar(extra){
  return `<div class="row noprint">
    <div><label>ตั้งแต่วันที่</label><input type="date" value="${period.from}" onchange="period.from=this.value;render()"></div>
    <div><label>ถึงวันที่</label><input type="date" value="${period.to}" onchange="period.to=this.value;render()"></div>
    ${extra||''}
    <div style="flex:0"><button class="btn sec printbtn" onclick="window.print()">🖨 พิมพ์</button></div></div>
    ${period.from&&period.to&&period.from>period.to?'<p class="bal bad noprint">⚠ วันที่เริ่มต้นอยู่หลังวันที่สิ้นสุด</p>':''}`;
}
function printHead(title){
  return `<div class="pt"><b>${esc(S.company||'')}</b><br>${title}<br>${fmtDate(period.from)} - ${fmtDate(period.to)}</div>`;
}

/* ---------- แท็บ ---------- */
const TABS = [['entry','✏️ บันทึกบัญชี'],['journal','📖 สมุดรายวัน'],['ledger','📚 แยกประเภท'],['tb','⚖️ งบทดลอง'],['fs','📊 งบการเงิน'],['set','⚙️ ตั้งค่า']];
let tab='entry', editingId=null;
function go(t){ if(tab==='entry'&&draft&&$('lines')){ try{ readLines(); }catch(e){} }
  if(t==='entry'&&tab==='entry'&&editingId){ editingId=null; draft=null; toast('เริ่มรายการใหม่'); }
  tab=t; if(t!=='set') tplEdit=null; if(t!=='entry'&&editingId){ editingId=null; draft=null; } render(); window.scrollTo(0,0); }
function render(){
  $('nav').innerHTML = TABS.map(([k,l],i)=>`<button class="${k===tab?'on':''}" title="Alt+${i+1}" onclick="go('${k}')">${l} <span class="mute">Alt+${i+1}</span></button>`).join('');
  $('accts').innerHTML = [...S.accounts].sort((a,b)=>a.code.localeCompare(b.code)).map(a=>`<option value="${esc(a.code+' '+a.name)}">`).join('');
  $('tpls').innerHTML = S.templates.map(t=>`<option value="${esc(t.name)}">`).join('');
  $('company').value = S.company||'';
  ({entry:rEntry, journal:rJournal, ledger:rLedger, tb:rTB, fs:rFS, set:rSet})[tab]();
}

/* ---------- 1) บันทึกบัญชี ---------- */
let draft = null;
function newDraft(){ const b=S.books[0]?.id||''; const d=today(); return {bookId:b,date:d,docNo:nextDocNo(b,d),desc:'',lines:[{code:'',note:'',dr:0,cr:0},{code:'',note:'',dr:0,cr:0}],manual:false}; }
function rEntry(){
  if(!draft || (editingId && draft.id!==editingId)){
    if(editingId){ const e=S.entries.find(x=>x.id===editingId); draft=JSON.parse(JSON.stringify(e)); draft.manual=true; }
    else draft=newDraft();
  }
  $('main').innerHTML = `<div class="card">
    <h2>${editingId?'แก้ไขรายการ':'บันทึกรายการบัญชี'}</h2>
    <div class="row noprint" style="background:var(--soft);padding:8px;border-radius:8px">
      <div class="w2"><label>⚡ ต้นแบบรายการ (Alt+T)</label><input id="fTpl" list="tpls" placeholder="พิมพ์ชื่อต้นแบบ แล้วกด Enter"></div>
      <div><label>จำนวนเงิน</label><input id="fAmt" type="number" step="0.01" min="0" placeholder="ใส่แล้ว Enter"></div>
      <div style="flex:0"><button class="btn sec" onclick="useTpl()">ใช้ต้นแบบ</button></div>
    </div>
    <div class="row">
      <div><label>เล่มเอกสาร</label><select id="fBook" onchange="onHead()">${S.books.map(b=>`<option value="${esc(b.id)}" ${b.id===draft.bookId?'selected':''}>${esc(b.id)} - ${esc(b.name)}</option>`).join('')}</select></div>
      <div><label>วันที่</label><input id="fDate" type="date" value="${draft.date}" onchange="onHead()"></div>
      <div><label>เลขที่เอกสาร</label><input id="fDoc" value="${esc(draft.docNo)}" oninput="draft.manual=true"></div>
    </div>
    <div class="row"><div class="w2"><label>คำอธิบายรายการ</label><input id="fDesc" value="${esc(draft.desc)}" placeholder="เช่น ขายสินค้าเงินสด"></div></div>
    <table class="lines"><thead><tr><th style="width:36%">บัญชี (พิมพ์รหัสหรือชื่อ)</th><th>หมายเหตุ</th><th class="n" style="width:15%">เดบิต</th><th class="n" style="width:15%">เครดิต</th><th style="width:36px"></th></tr></thead>
    <tbody id="lines"></tbody>
    <tfoot><tr><td colspan="2"><button class="btn sec" onclick="addLine()">+ เพิ่มบรรทัด</button></td><td class="n" id="tDr"></td><td class="n" id="tCr"></td><td></td></tr></tfoot></table>
    <div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span id="balMsg"></span><span style="flex:1"></span>
      <button class="btn sec" onclick="saveAsTpl()">⚡ บันทึกเป็นต้นแบบ</button>
      ${editingId?'<button class="btn sec" onclick="cancelEdit()">ยกเลิก</button>':''}
      <button class="btn" id="bSave" onclick="saveEntry()">💾 บันทึกรายการ <small>(Ctrl+Enter)</small></button>
    </div></div>
    <div class="card noprint"><h2>คีย์ลัด</h2><table><tbody>
      <tr><td><b>Enter</b></td><td>ไปช่องถัดไป: เล่ม → วันที่ → คำอธิบาย → บัญชี → เดบิต → เครดิต → บรรทัดถัดไป (ข้ามหมายเหตุ)</td></tr>
      <tr><td><b>พิมพ์บางส่วน</b></td><td>ช่องบัญชีพิมพ์แค่ <code>11</code> หรือ <code>เงินส</code> แล้วกด Enter/Tab ระบบเติมให้</td></tr>
      <tr><td><b>Enter ที่บรรทัดสุดท้าย</b></td><td>ถ้ายังไม่ดุลเพิ่มบรรทัดพร้อมยอดที่ขาด ถ้าดุลแล้วไปที่ปุ่มบันทึก</td></tr>

function addLine(){
  readLines();

function parseAcc(raw){
  const v=(raw||'').trim(); if(!v) return null;
  const code=v.split(/\s+/)[0]; if(acc(code)) return code;
  const m=S.accounts.filter(a=>a.name===v); return m.length===1? m[0].code : null;
}
function saveEntry(){
  readLines();
  if(!draft.date) return toast('กรุณาเลือกวันที่');
  if(!draft.docNo) return toast('กรุณากรอกเลขที่เอกสาร');
  if(S.entries.some(e=>e.docNo===draft.docNo && e.id!==editingId)) return toast('เลขที่เอกสารนี้ถูกใช้แล้ว');
  const lines=[];
  for(const l of draft.lines){
    if(!l.raw.trim() && !l.dr && !l.cr) continue;
    const code=parseAcc(l.raw); if(!code) return toast('ไม่พบบัญชี: '+(l.raw||'(ว่าง)'));
    if(l.dr<0||l.cr<0) return toast('จำนวนเงินต้องไม่ติดลบ');
    if(!!l.dr===!!l.cr) return toast('แต่ละบรรทัดต้องมีเดบิตหรือเครดิตอย่างใดอย่างหนึ่ง');
    lines.push({code, note:l.note, dr:l.dr, cr:l.cr});
  }
  if(lines.length<2) return toast('ต้องมีอย่างน้อย 2 บรรทัด');
  const dr=lines.reduce((s,l)=>s+l.dr,0), cr=lines.reduce((s,l)=>s+l.cr,0);
  if(dr!==cr) return toast('เดบิตกับเครดิตไม่เท่ากัน');
  const e={id:editingId||('e'+Date.now()+Math.random().toString(36).slice(2,6)), bookId:draft.bookId, docNo:draft.docNo, date:draft.date, desc:draft.desc.trim(), lines};
  if(editingId){ S.entries[S.entries.findIndex(x=>x.id===editingId)]=e; } else S.entries.push(e);
  save(); toast('บันทึกแล้ว '+e.docNo);

}

/* ---------- ข้อมูลตัวอย่าง (mock) ---------- */
const MOCK = {
  small: {label:'ธุรกิจขนาดเล็ก', seed:11, sc:1, months:[[2026,6,30,150],[2026,7,31,150],[2026,8,31,150]], cap:[150000,450000,200000,60000]},
  medium:{label:'ธุรกิจขนาดกลาง', seed:23, sc:3, months:[[2026,6,30,300],[2026,7,15,150]],               cap:[500000,1500000,800000,200000]}
};
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function genMock(kind){
  const M=MOCK[kind], sc=M.sc, rnd=mulberry(M.seed);
  const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)), pick=a=>a[Math.floor(rnd()*a.length)];
  const amtR=(lo,hi)=>Math.max(10,Math.round(ri(lo*sc,hi*sc)/10)*10)*100+(rnd()<0.2?50:0);   // หน่วยสตางค์
  const bal={'1100':0,'1110':0,'1200':0,'1300':0,'2100':0}, SGN={'1100':1,'1110':1,'1200':1,'1300':1,'2100':-1};
  let rev=0, cost=0, n=0; const out=[];
  const bk=id=>book(id)?id:S.books[0].id;
  const add=(date,bookId,desc,dr,cr,a)=>{
    if(dr in SGN) bal[dr]+=SGN[dr]*a; if(cr in SGN) bal[cr]-=SGN[cr]*a;
    if(cr==='4100') rev+=a; if(dr==='5100') cost+=a;
    out.push({date,bookId:bk(bookId),desc,lines:[{code:dr,note:'',dr:a,cr:0},{code:cr,note:'',dr:0,cr:a}]}); return true;
  };
  const payAcc=a=>{ const c=bal['1100']>=a, b=bal['1110']>=a; if(c&&b) return rnd()<0.4?'1100':'1110'; return c?'1100':b?'1110':null; };
  const cust=['บจก. สยามเทรดดิ้ง','ร้านสมศรีค้าส่ง','หจก. ไพศาลพาณิชย์','คุณมานะ ใจดี','บจก. กรุงเทพซัพพลาย','ร้านรุ่งเรืองการค้า'];
  const vend=['บจก. ไทยโฮลเซล','ห้างหุ้นส่วน ก้าวหน้า','บจก. เอสซี ดิสทริบิวชั่น','ร้านวัสดุภัณฑ์ไทย'];
  const exps=[['5900','ค่าน้ำมันรถส่งของ',200,1500],['5900','ค่าวัสดุสำนักงาน',100,2000],['5900','ค่าซ่อมบำรุง',300,4000],['5900','ค่าบรรจุภัณฑ์',200,3000],['5900','ค่าโฆษณาออนไลน์',500,5000],['5900','ค่าขนส่งสินค้า',100,1500],['5400','ค่าโทรศัพท์/อินเทอร์เน็ต',300,1500]];
  const T=[
    {w:34,run:d=>add(d,'RV',pick(['ขายสินค้าหน้าร้าน','ขายสินค้าออนไลน์','ขายสินค้าลูกค้าประจำ'])+' บิล #'+(1000+n),rnd()<0.75?'1100':'1110','4100',amtR(150,3500))},
    {w:10,run:d=>add(d,'SV','ขายเชื่อ '+pick(cust)+' บิล #'+(1000+n),'1200','4100',amtR(3000,30000))},
    {w:9, run:d=>{ if(bal['1200']<1500*sc*100) return false; const a=Math.min(bal['1200'],amtR(2000,25000)); return add(d,'RV','รับชำระหนี้ '+pick(cust),rnd()<0.7?'1110':'1100','1200',a); }},
    {w:9, run:d=>{ const need=0.6*rev-cost; if(need<500*sc*100||bal['1300']<need) return false; const a=Math.round(need*(0.5+rnd()*0.5)/100)*100; return a>0&&add(d,'JV','บันทึกต้นทุนขาย','5100','1300',a); }},
    {w:7, run:d=>{ const a=amtR(2000,20000), p=payAcc(a); return !!p&&add(d,'PV','ซื้อสินค้าเงินสด '+pick(vend),'1300',p,a); }},
    {w:6, run:d=>add(d,'PU','ซื้อสินค้าเชื่อ '+pick(vend),'1300','2100',amtR(5000,40000))},
    {w:5, run:d=>{ if(bal['2100']<1500*sc*100) return false; const a=Math.min(bal['2100'],amtR(5000,30000)), p=payAcc(a); return !!p&&add(d,'PV','จ่ายชำระเจ้าหนี้ '+pick(vend),'2100',p,a); }},
    {w:12,run:d=>{ const e=pick(exps), a=amtR(e[2],e[3]), p=payAcc(a); return !!p&&add(d,'PV',e[1],e[0],p,a); }},
    {w:4, run:d=>{ if(bal['1100']<8000*sc*100) return false; const a=Math.round(bal['1100']*0.5/10000)*10000; return add(d,'JV','นำเงินสดฝากธนาคาร','1110','1100',a); }},
    {w:2, run:d=>add(d,'RV','ดอกเบี้ยรับ/รายได้อื่น','1110','4900',amtR(100,1500))},
    {w:1, run:d=>{ const a=amtR(1000,5000), p=payAcc(a); return !!p&&add(d,'PV','เจ้าของถอนใช้ส่วนตัว','3200',p,a); }},
    {w:0.7,run:d=>{ const a=amtR(3000,15000); return bal['1110']>=a*3&&add(d,'PV','ซื้ออุปกรณ์สำนักงาน','1500','1110',a); }}
  ];
  const total=T.reduce((x,t)=>x+t.w,0);
  const random=d=>{ for(let i=0;i<30;i++){ let r=rnd()*total, t=T[0]; for(const x of T){ if((r-=x.w)<0){ t=x; break; } } if(t.run(d)) return; } T[0].run(d); };
  const thMonth=['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const fixedPay=(d,bookId,desc,dr,a)=>add(d,bookId,desc,dr,payAcc(a)||'1110',a);
  M.months.forEach(([y,m,days,count],mi)=>{
    const ds=day=>`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`, mn=thMonth[m]+' '+(y+543);
    const slots=[];
    if(mi===0){
      [['เจ้าของลงทุนเป็นเงินสด','1100',M.cap[0]],['เจ้าของลงทุนฝากเข้าบัญชีธนาคาร','1110',M.cap[1]],['เจ้าของลงทุนเป็นสินค้า','1300',M.cap[2]],['เจ้าของลงทุนเป็นอุปกรณ์','1500',M.cap[3]]]
        .forEach(([desc,code,a])=>slots.push({day:1,seq:-2,f:()=>add(ds(1),code==='1100'||code==='1110'?'RV':'JV',desc,code,'3100',a*100)}));
    }
    slots.push({day:1,seq:-1,f:()=>fixedPay(ds(1),'PV','ค่าเช่าร้านเดือน '+mn,'5300',15000*sc*100)});
    if(days>=25) slots.push({day:25,seq:-1,f:()=>fixedPay(ds(25),'PV','เงินเดือนพนักงานเดือน '+mn,'5200',25000*sc*100)});
    if(days>=8)  slots.push({day:8,seq:-1,f:()=>fixedPay(ds(8),'PV','ค่าน้ำ ค่าไฟ เดือน '+mn,'5400',(2500+ri(0,20)*100)*sc*100)});
    const fx=slots.length;
    for(let i=0;i<count-fx;i++){ const day=ri(1,days); slots.push({day,seq:i,f:()=>random(ds(day))}); }
    slots.sort((a,b)=>a.day-b.day||a.seq-b.seq);
    slots.forEach(sl=>{ sl.f(); n++; });
  });
  return out;
}
function loadMock(kind){
  const M=MOCK[kind];
  const need=['1100','1110','1200','1300','1500','2100','3100','3200','4100','4900','5100','5200','5300','5400','5900'].filter(c=>!acc(c));
  if(need.length) return toast('ผังบัญชีไม่ครบ ขาดรหัส: '+need.join(', '));
  const run=()=>{
    const list=genMock(kind);
    S.entries=[]; list.forEach((e,i)=>{ e.id='m'+i; e.docNo=nextDocNo(e.bookId,e.date); S.entries.push(e); });
    if(!S.company) S.company='ธุรกิจตัวอย่าง (ข้อมูลทดสอบ)';
    const last=list.reduce((m,e)=>e.date>m?e.date:m,'');
    period={from:'2026-06-01',to:last}; draft=null; save(); go('journal'); toast('สร้างข้อมูลตัวอย่าง '+list.length+' รายการแล้ว');
  };
  if(S.entries.length) askConfirm('จะแทนที่รายการบัญชีทั้งหมด ('+S.entries.length+' รายการ) ด้วยข้อมูลตัวอย่าง "'+M.label+'" ดำเนินการต่อ?').then(ok=>ok&&run()); else run();
}
function clearEntries(){ if(!S.entries.length) return; askConfirm('ลบรายการบัญชีทั้งหมด '+S.entries.length+' รายการ? (ผังบัญชี เล่ม และต้นแบบยังอยู่)').then(ok=>{ if(ok){ S.entries=[]; draft=null; save(); render(); toast('ลบรายการทั้งหมดแล้ว'); } }); }

function restoreText(text){
  let d; try{ d=JSON.parse(text); if(!d.accounts||!d.books||!d.entries) throw 0; }catch(e){ return toast('ข้อมูลไม่ถูกต้อง'); }
  askConfirm('แทนที่ข้อมูลปัจจุบันด้วยข้อมูลนี้?').then(ok=>{ if(!ok) return; if(!d.templates) d.templates=[]; S=d; draft=null; save(); render(); toast('นำเข้าแล้ว'); });
}
function restore(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>restoreText(r.result); r.readAsText(f); inp.value=''; }
function restorePaste(){ dlg('วางข้อมูลสำรอง (JSON) ที่คัดลอกไว้',{text:'',ph:'วางที่นี่',ok:'นำเข้า'}).then(v=>{ if(v) restoreText(v); }); }
function resetAll(){ askConfirm('ล้างข้อมูลทั้งหมดและกลับเป็นค่าเริ่มต้น? ย้อนกลับไม่ได้').then(ok=>{ if(ok){ S=defaults(); draft=null; save(); render(); } }); }

/* ---------- ต้นแบบรายการ ---------- */
function findTpl(v){
  v=(v||'').trim().toLowerCase(); if(!v) return null;
  const n=t=>t.name.toLowerCase();
  return S.templates.find(t=>n(t)===v)||S.templates.find(t=>n(t).startsWith(v))||S.templates.find(t=>n(t).includes(v))||null;
}
function useTpl(){
  const t=findTpl($('fTpl').value); if(!t) return toast('ไม่พบต้นแบบ');
  const amt=sat($('fAmt').value);
  readLines(); draft.date=$('fDate').value||draft.date; draft.bookId=$('fBook').value;
  if(book(t.bookId)) draft.bookId=t.bookId;
  draft.desc=t.desc||t.name;
  draft.lines=t.lines.filter(l=>acc(l.code)).map(l=>{ const a=l.fixed||amt; return {code:l.code,note:l.note||'',dr:l.side==='dr'?a:0,cr:l.side==='cr'?a:0}; });
  while(draft.lines.length<2) draft.lines.push({code:'',note:'',dr:0,cr:0});
  if(!draft.manual&&!editingId) draft.docNo=nextDocNo(draft.bookId,draft.date);
  render(); $('fDesc').focus(); $('fDesc').select();
  toast('ใช้ต้นแบบ: '+t.name);
}
function saveAsTpl(){
  readLines();
  const lines=[];
  for(const l of draft.lines){
    if(!l.raw.trim()&&!l.dr&&!l.cr) continue;
    const code=parseAcc(l.raw); if(!code) return toast('ไม่พบบัญชี: '+(l.raw||'(ว่าง)'));
    if(l.dr<0||l.cr<0||!!l.dr===!!l.cr) return toast('แต่ละบรรทัดต้องมีเดบิตหรือเครดิตอย่างใดอย่างหนึ่ง');
    lines.push({code,side:l.dr?'dr':'cr',note:l.note,amt:l.dr||l.cr});
  }
  if(lines.length<2) return toast('ต้องมีอย่างน้อย 2 บรรทัด');
  const bookId=draft.bookId, desc=draft.desc.trim();
  askPrompt('ชื่อต้นแบบ',draft.desc||'').then(v=>{
    const name=(v||'').trim(); if(!name) return;
    if(S.templates.some(t=>t.name===name)) return toast('มีต้นแบบชื่อนี้แล้ว');
    const same=new Set(lines.map(l=>l.amt)).size===1;   // ยอดเท่ากันทุกบรรทัด = ใช้ "จำนวนเงิน" ช่องเดียว
    S.templates.push({name,bookId,desc:desc||name,lines:lines.map(l=>({code:l.code,side:l.side,note:l.note,fixed:same?0:l.amt}))});
    save(); render(); toast('บันทึกต้นแบบแล้ว');
  });
}

  render(); $('tplEd').scrollIntoView({block:'center'}); $('tName').focus();
}
function tplAddRow(){ tplRead(); tplEdit.lines.push({raw:'',side:'dr',fixed:0}); render(); $('tplEd').scrollIntoView({block:'center'}); }
function tplDelRow(i){ tplRead(); if(tplEdit.lines.length<=2) return toast('ต้องมีอย่างน้อย 2 บรรทัด'); tplEdit.lines.splice(i,1); render(); }
function tplSave(){
  tplRead(); const e=tplEdit, name=e.name.trim();
  if(!name) return toast('กรอกชื่อเรื่อง');
  if(S.templates.some((t,i)=>t.name===name&&i!==e.idx)) return toast('มีต้นแบบชื่อนี้แล้ว');
  const lines=[];
  for(const l of e.lines){ if(l.fixed<0) return toast('ยอดคงที่ต้องไม่ติดลบ'); const code=parseAcc(l.raw); if(!code) return toast('ไม่พบบัญชี: '+(l.raw||'(ว่าง)')); lines.push({code,side:l.side,note:'',fixed:l.fixed}); }
  if(!lines.some(l=>l.side==='dr')||!lines.some(l=>l.side==='cr')) return toast('ต้องมีทั้งเดบิตและเครดิต');
  const t={name,bookId:e.bookId,desc:e.desc.trim()||name,lines};
  if(e.idx<0) S.templates.push(t); else S.templates[e.idx]=t;
  tplEdit=null; save(); render(); toast('บันทึกต้นแบบแล้ว');
}
function delTpl(i){ askConfirm('ลบต้นแบบ '+S.templates[i].name+' ?').then(ok=>{ if(ok){ S.templates.splice(i,1); tplEdit=null; save(); render(); } }); }

/* ---------- คีย์ลัด ---------- */
function resolveAcc(inp){
  const v=inp.value.trim(); if(!v) return;
  const ok=parseAcc(v); if(ok){ inp.value=accName(ok); return; }
  const q=v.toLowerCase(), list=[...S.accounts].sort((a,b)=>a.code.localeCompare(b.code));
  const m=list.find(a=>a.code.startsWith(q))||list.find(a=>a.name.toLowerCase().includes(q));
  if(m) inp.value=accName(m.code);
}
function focusRow(tr,cls){ const el=tr&&tr.querySelector('.'+cls); if(el){ el.focus(); el.select&&el.select(); } }
function entryEnter(e){
  const t=e.target, id=t.id;
  if(id==='fTpl'){ e.preventDefault(); const tp=findTpl(t.value); if(!tp) return toast('ไม่พบต้นแบบ'); t.value=tp.name;
    if(!$('fAmt').value && tp.lines.some(l=>!l.fixed)) $('fAmt').focus(); else useTpl(); return; }
  if(id==='fAmt'){ e.preventDefault(); if($('fTpl').value) useTpl(); return; }
  if(id==='fBook'){ e.preventDefault(); $('fDate').focus(); return; }
  if(id==='fDate'){ e.preventDefault(); $('fDesc').focus(); return; }
  if(id==='fDesc'){ e.preventDefault(); focusRow(document.querySelector('#lines tr'),'acc'); return; }
  const tr=t.closest('#lines tr'); if(!tr) return;
  e.preventDefault();
  if(t.classList.contains('acc')){ resolveAcc(t); focusRow(tr, tr.querySelector('.cr').value?'cr':'dr'); return; }
  if(t.classList.contains('note')){ focusRow(tr,'dr'); return; }
  if(t.classList.contains('dr') && !t.value){ focusRow(tr,'cr'); return; }
  const nx=tr.nextElementSibling;
  if(nx){ focusRow(nx,'acc'); return; }
  let dr=0,cr=0; document.querySelectorAll('#lines tr').forEach(r=>{ dr+=sat(r.querySelector('.dr').value); cr+=sat(r.querySelector('.cr').value); });
  if(dr!==cr) addLine(); else $('bSave').focus();
}
document.addEventListener('keydown',e=>{
  if($('dlg')) return;
  if(e.altKey&&!e.ctrlKey&&!e.metaKey&&/^Digit[1-6]$/.test(e.code)){ e.preventDefault(); go(TABS[+e.code.slice(5)-1][0]); return; }
  const typing=/INPUT|SELECT|TEXTAREA|BUTTON|A/.test(e.target.tagName);
  if(tab==='entry'){
    if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='Enter')){ e.preventDefault(); saveEntry(); return; }
    if(e.key==='Escape'&&editingId){ cancelEdit(); return; }
    if(e.altKey&&e.code==='KeyT'){ e.preventDefault(); $('fTpl').focus(); $('fTpl').select(); return; }
    if(e.altKey&&e.code==='KeyN'){ e.preventDefault(); addLine(); return; }
    if(e.altKey&&e.key==='Backspace'){ const tr=e.target.closest&&e.target.closest('#lines tr'); if(tr){ e.preventDefault(); delLine([...tr.parentNode.children].indexOf(tr)); } return; }
    if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey&&e.target.tagName!=='BUTTON') entryEnter(e);
  } else if(tab==='journal' && !typing){
    if(e.key==='ArrowDown'||e.key==='j'){ e.preventDefault(); selJ(1); }
    else if(e.key==='ArrowUp'||e.key==='k'){ e.preventDefault(); selJ(-1); }
    else if(e.key==='e'||e.key==='Enter'){ const el=document.querySelectorAll('.entry')[jSel]; if(el){ e.preventDefault(); editEntry(el.dataset.id); } }
    else if(e.key==='Delete'||e.key==='d'){ const el=document.querySelectorAll('.entry')[jSel]; if(el){ const i=jSel; delEntry(el.dataset.id).then(ok=>{ const n=document.querySelectorAll('.entry').length; if(ok&&n){ jSel=Math.min(i,n-1); selJ(0); } }); } }
  }
});
document.addEventListener('focusin',e=>{ if(e.target.closest&&e.target.closest('#lines')&&e.target.select) e.target.select(); });

try{ if(window.claude) document.body.classList.add('inviewer'); }catch(e){}
render();
</script>
