<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="330" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">Double Lift: พลิกไพ่ 2 ใบให้เหมือนใบเดียว</text><circle cx="40" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="40" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="62" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">จับไพ่ 2 ใบบนสุดเป็นก้อนเดียว</text><rect x="60" y="100" width="150" height="24" rx="5" fill="#ffffff" stroke="#f59e0b" stroke-width="3" /><text x="135.0" y="117.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">A+B = 'ใบเดียว'</text><rect x="60" y="126" width="150" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="135.0" y="143.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">ใบที่ 3</text><rect x="60" y="152" width="150" height="24" rx="5" fill="#e8eefc" stroke="#9ca3af" stroke-width="1.2" /><text x="135.0" y="169.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">…</text><line x1="230" y1="130" x2="290" y2="130" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="305" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="305" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="327" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">จับด้วยนิ้วโป้ง+นิ้วชี้ขวา</text><rect x="300" y="100" width="150" height="24" rx="5" fill="#fff3cd" stroke="#f59e0b" stroke-width="3" /><text x="375" y="117" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">A (บน) ซ้อน B (ล่าง)</text><text x="375" y="150" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">พลิกขึ้นเหมือนพลิกใบเดียว</text><line x1="470" y1="130" x2="520" y2="130" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="530" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="530" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="552" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">หงายหน้า = เห็นหน้า B</text><rect x="540" y="90" width="60" height="84" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="3.5" /><text x="546" y="109" font-size="16" text-anchor="start" font-weight="700" fill="#c62828">Q♥</text><text x="570.0" y="160" font-size="28" text-anchor="middle" font-weight="400" fill="#c62828">♥</text><text x="570" y="195" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">คนดูคิดว่านี่คือใบบนสุด</text><rect x="30" y="230" width="700" height="76" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="254" font-size="14" text-anchor="middle" font-weight="700" fill="#15803d">คว่ำกลับทั้งก้อน → คนดูเชื่อว่าใบบนสุดคือ B  แต่ความจริงใบบนสุดคือ A</text><text x="380" y="276" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">(พลิกก้อน 2 ใบขึ้น → เห็น B  ·  คว่ำลง → A กลับขึ้นบน, B ซ่อนใต้ A)</text><text x="380" y="296" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">จุดตายคือ 'สองใบเหลื่อมกัน' → ฝึกให้ขอบเรียบสนิท</text></svg>