<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="400" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">เส้นทางการเรียน: ไต่ระดับจากง่ายไปยาก</text><rect x="30" y="178" width="220" height="202" rx="12" fill="#fff" stroke="#15803d" stroke-width="2.5" /><text x="140" y="206" font-size="17" text-anchor="middle" font-weight="700" fill="#15803d">ระดับง่าย</text><rect x="46" y="220" width="188" height="22" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" /><text x="140" y="236" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">ไพ่คีย์</text><rect x="46" y="248" width="188" height="22" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" /><text x="140" y="264" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">ไพ่ 9 ใบ</text><rect x="46" y="276" width="188" height="22" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" /><text x="140" y="292" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Overhand Shuffle</text><rect x="46" y="304" width="188" height="22" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" /><text x="140" y="320" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Glimpse</text><rect x="46" y="332" width="188" height="22" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" /><text x="140" y="348" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Cross-Cut Force</text><line x1="254" y1="330" x2="266" y2="330" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="270" y="150" width="220" height="230" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2.5" /><text x="380" y="178" font-size="17" text-anchor="middle" font-weight="700" fill="#f59e0b">ระดับกลาง</text><rect x="286" y="192" width="188" height="22" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" /><text x="380" y="208" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">ไพ่ 21 ใบ</text><rect x="286" y="220" width="188" height="22" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" /><text x="380" y="236" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Gilbreath</text><rect x="286" y="248" width="188" height="22" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" /><text x="380" y="264" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Si Stebbins</text><rect x="286" y="276" width="188" height="22" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" /><text x="380" y="292" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Double Lift</text><rect x="286" y="304" width="188" height="22" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" /><text x="380" y="320" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Hindu Shuffle Force</text><rect x="286" y="332" width="188" height="22" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" /><text x="380" y="348" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Riffle + Bridge</text><line x1="494" y1="330" x2="506" y2="330" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="510" y="178" width="220" height="202" rx="12" fill="#fff" stroke="#c62828" stroke-width="2.5" /><text x="620" y="206" font-size="17" text-anchor="middle" font-weight="700" fill="#c62828">ระดับยาก</text><rect x="526" y="220" width="188" height="22" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" /><text x="620" y="236" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">Fitch–Cheney 5 ใบ</text><rect x="526" y="248" width="188" height="22" rx="5" fill="#f8fafc"