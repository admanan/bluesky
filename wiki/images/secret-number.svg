<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="340" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">เลขลับจากไพ่: ผู้ชมคำนวณเงียบ ๆ คุณบอกไพ่ได้จากผลลัพธ์</text><rect x="24" y="56" width="136" height="70" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" /><text x="92" y="82" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">เลือกไพ่ 1 ใบ</text><text x="92" y="110" font-size="18" text-anchor="middle" font-weight="700" fill="#1d4ed8">7♥ (ค่า 7)</text><line x1="162" y1="91" x2="170" y2="91" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="170" y="56" width="136" height="70" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" /><text x="238" y="82" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">× 2</text><text x="238" y="110" font-size="18" text-anchor="middle" font-weight="700" fill="#1d4ed8">14</text><line x1="308" y1="91" x2="316" y2="91" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="316" y="56" width="136" height="70" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" /><text x="384" y="82" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">+ 3</text><text x="384" y="110" font-size="18" text-anchor="middle" font-weight="700" fill="#1d4ed8">17</text><line x1="454" y1="91" x2="462" y2="91" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="462" y="56" width="136" height="70" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" /><text x="530" y="82" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">× 5</text><text x="530" y="110" font-size="18" text-anchor="middle" font-weight="700" fill="#1d4ed8">85</text><line x1="600" y1="91" x2="608" y2="91" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="608" y="56" width="136" height="70" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" /><text x="676" y="82" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">+ เลขดอก (♥ = 3)</text><text x="676" y="110" font-size="18" text-anchor="middle" font-weight="700" fill="#1d4ed8">88</text><text x="30" y="156" font-size="15" text-anchor="start" font-weight="700" fill="#1f2937">ผู้ชมบอกผลลัพธ์สุดท้าย = 88</text><rect x="30" y="172" width="700" height="52" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="196" font-size="14" text-anchor="middle" font-weight="700" fill="#15803d">คุณลบ 15 → 88 − 15 = 73   →   หลักสิบ = ค่าไพ่ (7)   หลักหน่วย = เลขดอก (3 = ♥)</text><text x="380" y="214" font-size="14" text-anchor="middle" font-weight="700" fill="#15803d">ได้ 7♥</text><text x="30" y="252" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">เลขดอก:</text><rect x="120" y="234" width="100" height="28" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="170" y="254" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">♣ = 1</text><rect x="230" y="234" width="100" height="28" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="280" y="254" font-size="15" text-anchor="middle" font-weight="700" fill="#c62828">♦ = 2</text><rect x="340" y="234" width="100" height="28" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="390" y="254" font-size="15" text-anchor="middle" font-weight="700" fill="#c62828">♥ = 3</text><rect x="450" y="234" width="100" height="28" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="500" y="254" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">♠ = 4</text><text x="380" y="296" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">สูตร: ((ค่า × 2) + 3) × 5 + ดอก = 10 × ค่า + 15 + ดอก  (J Q K ใช้ 11, 12, 13 ก็ได้ ผลสิบหลักเป็น 11–13)</text><text x="380" y="316" font-size="12" text-anchor="middle" font-weight="700" fill="#15803d">ตรวจครบทุกค่า A–10 × 4 ดอกแล้ว</text></svg>