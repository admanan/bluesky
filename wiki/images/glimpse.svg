<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="300" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">Glimpse: แอบดูไพ่ใบล่างสุดตอนเคาะสำรับให้เรียบ</text><text x="190" y="62" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">มองจากด้านข้าง</text><rect x="60" y="150" width="260" height="14" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1.2" /><line x1="60" y1="148" x2="320" y2="148" stroke="#1e2f5c" stroke-width="0.6"/><line x1="60" y1="148" x2="320" y2="148" stroke="#1e2f5c" stroke-width="0.6"/><line x1="60" y1="148" x2="320" y2="148" stroke="#1e2f5c" stroke-width="0.6"/><line x1="60" y1="148" x2="320" y2="148" stroke="#1e2f5c" stroke-width="0.6"/><line x1="60" y1="148" x2="320" y2="148" stroke="#1e2f5c" stroke-width="0.6"/><line x1="60" y1="148" x2="320" y2="148" stroke="#1e2f5c" stroke-width="0.6"/><polygon points="60,150 320,150 300,164 40,164" fill="#2f4b8f" stroke="#1e2f5c"/><polygon points="60,164 130,164 130,184 60,184" fill="#fff" stroke="#6b7280"/><text x="66" y="180" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">7♣</text><text x="190" y="210" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">ปลายสำรับฝั่งนิ้วหัวแม่มือยกขึ้นเล็กน้อย</text><text x="190" y="228" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">ดัชนีมุมของใบล่างสุดจะโผล่ให้เห็น</text><line x1="190" y1="118" x2="100" y2="160" stroke="#f59e0b" stroke-width="3" marker-end="url(#ar)"/><text x="215" y="112" font-size="12" text-anchor="start" font-weight="600" fill="#1f2937">สายตา</text><circle cx="36" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="36" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="560" y="62" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">ท่าเคาะสำรับ (มองจากด้านบน)</text><rect x="470" y="80" width="90" height="128" rx="6" fill="#2f4b8f" stroke="#6b7280" stroke-width="1.3" /><rect x="475" y="85" width="80" height="118" rx="3" fill="none" stroke="#9db4e8" stroke-width="1" /><rect x="486" y="96" width="90" height="128" rx="6" fill="#2f4b8f" stroke="#6b7280" stroke-width="1.3" /><rect x="491" y="101" width="80" height="118" rx="3" fill="none" stroke="#9db4e8" stroke-width="1" /><rect x="470" y="180" width="22" height="28" rx="3" fill="#ffffff" stroke="#f59e0b" stroke-width="3" /><text x="481" y="200" font-size="11" text-anchor="middle" font-weight="700" fill="#1f2937">7♣</text><text x="570" y="150" font-size="12" text-anchor="start" font-weight="700" fill="#1d4ed8">← มุมล่างซ้ายโผล่</text><text x="380" y="270" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">เคล็ดลับ: ทำระหว่างที่พูดคุย / จัดสำรับให้เรียบ ห้ามหยุดมือหรือมองนาน</text></svg>