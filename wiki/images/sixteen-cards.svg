<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="340" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">ไพ่ 16 ใบ: ถาม 'กองซ้ายหรือขวา' 4 ครั้ง → ไพ่ที่คิดไว้ไปอยู่ตำแหน่งที่ต้องการ</text><text x="30" y="62" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">แต่ละรอบ: แจกหงายสลับ 2 กอง (กองละ 8) → ผู้ชมบอกกอง → พลิกแต่ละกองคว่ำ → วางกองนั้นไว้ 'บน' หรือ 'ล่าง'</text><text x="30" y="86" font-size="13" text-anchor="start" font-weight="700" fill="#1d4ed8">ตำแหน่งปลายทาง t (นับจาก 0) เป็นเลขฐาน 2: บิตขวาสุด = รอบ 1 · บิต 0 = วางกองไว้บน, บิต 1 = วางไว้ล่าง</text><text x="40" y="122" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">อยากให้ไพ่เป็นใบที่</text><text x="270" y="122" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">รอบ 1</text><text x="380" y="122" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">รอบ 2</text><text x="490" y="122" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">รอบ 3</text><text x="600" y="122" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">รอบ 4</text><rect x="30" y="132" width="700" height="32" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="40" y="154" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">ใบที่ 1  (บนสุด)</text><text x="270" y="154" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">บน</text><text x="380" y="154" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">บน</text><text x="490" y="154" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">บน</text><text x="600" y="154" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">บน</text><rect x="30" y="172" width="700" height="32" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="40" y="194" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">ใบที่ 6</text><text x="270" y="194" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">ล่าง</text><text x="380" y="194" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">บน</text><text x="490" y="194" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">ล่าง</text><text x="600" y="194" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">บน</text><rect x="30" y="212" width="700" height="32" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="40" y="234" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">ใบที่ 9</text><text x="270" y="234" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">บน</text><text x="380" y="234" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">บน</text><text x="490" y="234" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">บน</text><text x="600" y="234" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">ล่าง</text><rect x="30" y="252" width="700" height="32" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="40" y="274" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">ใบที่ 16  (ล่างสุด)</text><text x="270" y="274" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">ล่าง</text><text x="380" y="274" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">ล่าง</text><text x="490" y="274" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">ล่าง</text><text x="600" y="274" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">ล่าง</text><rect x="30" y="300" width="700" height="32" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="321" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">อยากได้ 'ไพ่บนสุด' ง่ายสุด: วางกองที่ผู้ชมบอกไว้ 'บน' ทั้ง 4 รอบ (ตรวจครบ 16 × 16 แล้ว)</text></svg>