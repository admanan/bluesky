<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="330" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">ไพ่คีย์ (Key Card): ไพ่ใบที่คนดูเลือก จะอยู่ติดหลังไพ่คีย์เสมอ</text><circle cx="52" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="52" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="72" y="67" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">แอบดูไพ่ใบล่างสุด</text><rect x="50" y="90" width="96" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="98.0" y="107.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><rect x="50" y="116" width="96" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="98.0" y="133.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><rect x="50" y="142" width="96" height="24" rx="5" fill="#e8eefc" stroke="#9ca3af" stroke-width="1.2" /><text x="98.0" y="159.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">…</text><rect x="50" y="168" width="96" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="98.0" y="185.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><rect x="50" y="194" width="96" height="24" rx="5" fill="#ffffff" stroke="#f59e0b" stroke-width="3" /><text x="98.0" y="211.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">7♣</text><line x1="170" y1="170" x2="235" y2="170" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="297" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="297" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="317" y="67" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">คนดูหยิบไพ่ X มาวางบนสุด</text><rect x="295" y="90" width="96" height="24" rx="5" fill="#ffffff" stroke="#f59e0b" stroke-width="3" /><text x="343.0" y="107.0" font-size="14" text-anchor="middle" font-weight="600" fill="#c62828">K♦</text><rect x="295" y="116" width="96" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="343.0" y="133.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><rect x="295" y="142" width="96" height="24" rx="5" fill="#e8eefc" stroke="#9ca3af" stroke-width="1.2" /><text x="343.0" y="159.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">…</text><rect x="295" y="168" width="96" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="343.0" y="185.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><rect x="295" y="194" width="96" height="24" rx="5" fill="#ffffff" stroke="#f59e0b" stroke-width="3" /><text x="343.0" y="211.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">7♣</text><line x1="415" y1="170" x2="480" y2="170" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="542" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="542" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="562" y="67" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">ตัดสำรับกี่ครั้งก็ได้</text><rect x="540" y="90" width="96" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="588.0" y="107.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><rect x="540" y="116" width="96" height="24" rx="5" fill="#e8eefc" stroke="#9ca3af" stroke-width="1.2" /><text x="588.0" y="133.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">…</text><rect x="540" y="142" width="96" height="24" rx="5" fill="#ffffff" stroke="#f59e0b" stroke-width="3" /><text x="588.0" y="159.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">7♣</text><rect x="540" y="168" width="96" height="24" rx="5" fill="#ffffff" stroke="#f59e0b" stroke-width="3" /><text x="588.0" y="185.0" font-size="14" text-anchor="middle" font-weight="600" fill="#c62828">K♦</text><rect x="540" y="194" width="96" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="588.0" y="211.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><rect x="540" y="220" width="96" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="588.0" y="237.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><text x="380" y="290" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d">ไพ่คีย์ = 7♣ (ใบที่แอบดู)   ไพ่ที่คนดูเลือก = ใบถัดจากไพ่คีย์ = K♦</text><text x="380" y="312" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280">สำรับต้องไม่ถูก 'สับ' หลังขั้นตอน ② ตัดได้อย่างเดียว</text></svg>