<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="300" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">Fitch–Cheney ถอดรหัสเร็ว: 3 ขั้นตอนใน 5 วินาที</text><rect x="30" y="60" width="220" height="120" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="3" /><text x="140" y="90" font-size="16" text-anchor="middle" font-weight="700" fill="#1d4ed8">① ใบแรก</text><text x="140" y="124" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">ดู 'ดอก' → ดอกของใบซ่อน</text><text x="140" y="148" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">จำ 'เลข' เป็นจุดเริ่ม</text><line x1="254" y1="120" x2="266" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="270" y="60" width="220" height="120" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="3" /><text x="380" y="90" font-size="16" text-anchor="middle" font-weight="700" fill="#f59e0b">② ใบที่เหลือ 3 ใบ</text><text x="380" y="124" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">เรียงเล็ก–กลาง–ใหญ่</text><text x="380" y="148" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">→ อ่านรหัส d (1–6)</text><line x1="494" y1="120" x2="506" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="510" y="60" width="220" height="120" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="3" /><text x="620" y="90" font-size="16" text-anchor="middle" font-weight="700" fill="#15803d">③ บวก</text><text x="620" y="124" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">ใบซ่อน = เลขใบแรก + d</text><text x="620" y="148" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">(เกิน K ให้วนกลับ A)</text><rect x="30" y="204" width="700" height="74" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2" /><text x="380" y="230" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">เทคนิคช่วยจำ: d = ตำแหน่งในลิสต์ SML, SLM, MSL, MLS, LSM, LMS</text><text x="380" y="252" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">เล็ก–กลาง–ใหญ่ ใช้ A&lt;2&lt;…&lt;K ก่อน ถ้าเลขเท่ากันใช้ ♣&lt;♦&lt;♥&lt;♠</text><text x="380" y="270" font-size="12" text-anchor="middle" font-weight="700" fill="#15803d">กฎนี้ตรวจแล้วครบทุก 2,598,960 มือ</text></svg>