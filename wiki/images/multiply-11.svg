<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="352" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">คูณ 11 ทันที: บวกเลขที่อยู่ติดกัน (มี 0 ที่หัวและท้าย) จากขวาไปซ้าย</text><rect x="30" y="52" width="700" height="80" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="46" y="80" font-size="18" text-anchor="start" font-weight="700" fill="#1d4ed8">53 × 11</text><text x="46" y="108" font-size="13" text-anchor="start" font-weight="600" fill="#6b7280">เติม 0: 0 5 3 0</text><text x="250" y="80" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">3  →  5+3=8  →  0+5=5</text><text x="250" y="108" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">เขียนตัวเลขที่ได้จากขวาไปซ้าย → 583</text><text x="720" y="108" font-size="20" text-anchor="end" font-weight="700" fill="#15803d">= 583</text><rect x="30" y="142" width="700" height="80" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="46" y="170" font-size="18" text-anchor="start" font-weight="700" fill="#1d4ed8">78 × 11</text><text x="46" y="198" font-size="13" text-anchor="start" font-weight="600" fill="#6b7280">เติม 0: 0 7 8 0</text><text x="250" y="170" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">8  →  7+8=15 → 5 ทด 1  →  0+7+1=8</text><text x="250" y="198" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">เขียนตัวเลขที่ได้จากขวาไปซ้าย → 858</text><text x="720" y="198" font-size="20" text-anchor="end" font-weight="700" fill="#15803d">= 858</text><rect x="30" y="232" width="700" height="80" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="46" y="260" font-size="18" text-anchor="start" font-weight="700" fill="#1d4ed8">246 × 11</text><text x="46" y="288" font-size="13" text-anchor="start" font-weight="600" fill="#6b7280">เติม 0: 0 2 4 6 0</text><text x="250" y="260" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">6  →  4+6=10 → 0 ทด 1  →  2+4+1=7  →  0+2=2</text><text x="250" y="288" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">เขียนตัวเลขที่ได้จากขวาไปซ้าย → 2706</text><text x="720" y="288" font-size="20" text-anchor="end" font-weight="700" fill="#15803d">= 2706</text><text x="380" y="336" font-size="12" text-anchor="middle" font-weight="600" fill="#6b7280">ใช้ได้กับเลขกี่หลักก็ได้ — ให้ผู้ชมเลือกไพ่ A–9 กี่ใบก็ได้ เรียงเป็นเลข</text></svg>