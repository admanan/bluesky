t="700" fill="#15803d">รอบ1 = ช่อง 4</text><text x="600" y="269" font-size="13" text-anchor="start" font-weight="700" fill="#15803d">รอบ2 = ช่อง 4</text><rect x="350" y="296" width="380" height="56" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="540" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">ใบที่ 13 (กลางพอดี) = ช่อง 2 ทั้งสองรอบ</text><text x="540" y="340" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">ตรวจทุกตำแหน่งเริ่ม × ปลายทางแล้ว</text></svg>