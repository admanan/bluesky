<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="370" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">Hamming 7 ใบ: ไพ่ 7 ใบ คุมคู่–คี่ 3 กลุ่ม → ผู้ชมพลิก 1 ใบ คุณบอกได้ว่าใบไหน</text><text x="30" y="68" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">① จัดไพ่: ใบที่ 3, 5, 6, 7 ตามใจ  ·  ใบที่ 1, 2, 4 = ไพ่คุม (ทำให้แต่ละกลุ่มมีหงายเป็นเลขคู่)</text><rect x="40" y="76" width="80" height="70" rx="8" fill="#2f4b8f" stroke="#6b7280" stroke-width="1.5" /><text x="80" y="104" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">ใบที่ 1</text><text x="80" y="128" font-size="12" text-anchor="middle" font-weight="400" fill="#cbd5e1">คว่ำ</text><text x="80" y="164" font-size="10" text-anchor="middle" font-weight="700" fill="#15803d">ไพ่คุม</text><rect x="138" y="76" width="80" height="70" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5" /><text x="178" y="104" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">ใบที่ 2</text><text x="178" y="128" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">หงาย</text><text x="178" y="164" font-size="10" text-anchor="middle" font-weight="700" fill="#15803d">ไพ่คุม</text><rect x="236" y="76" width="80" height="70" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5" /><text x="276" y="104" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">ใบที่ 3</text><text x="276" y="128" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">หงาย</text><rect x="334" y="76" width="80" height="70" rx="8" fill="#2f4b8f" stroke="#6b7280" stroke-width="1.5" /><text x="374" y="104" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">ใบที่ 4</text><text x="374" y="128" font-size="12" text-anchor="middle" font-weight="400" fill="#cbd5e1">คว่ำ</text><text x="374" y="164" font-size="10" text-anchor="middle" font-weight="700" fill="#15803d">ไพ่คุม</text><rect x="432" y="76" width="80" height="70" rx="8" fill="#2f4b8f" stroke="#6b7280" stroke-width="1.5" /><text x="472" y="104" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">ใบที่ 5</text><text x="472" y="128" font-size="12" text-anchor="middle" font-weight="400" fill="#cbd5e1">คว่ำ</text><rect x="530" y="76" width="80" height="70" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5" /><text x="570" y="104" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">ใบที่ 6</text><text x="570" y="128" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">หงาย</text><rect x="628" y="76" width="80" height="70" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5" /><text x="668" y="104" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">ใบที่ 7</text><text x="668" y="128" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">หงาย</text><text x="30" y="188" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">② ผู้ชมพลิกไพ่ใบที่ 6</text><rect x="40" y="196" width="80" height="70" rx="8" fill="#2f4b8f" stroke="#6b7280" stroke-width="1.5" /><text x="80" y="224" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">ใบที่ 1</text><text x="80" y="248" font-size="12" text-anchor="middle" font-weight="400" fill="#cbd5e1">คว่ำ</text><text x="80" y="284" font-size="10" text-anchor="middle" font-weight="700" fill="#15803d">ไพ่คุม</text><rect x="138" y="196" width="80" height="70" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5" /><text x="178" y="224" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">ใบที่ 2</text><text x="178" y="248" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">หงาย</text><text x="178" y="284" font-size="10" text-anchor="middle" font-weight="700" fill="#15803d">ไพ่คุม</text><rect x="236" y="196" width="80" height="70" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5" /><text x="276" y="224" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">ใบที่ 3</text><text x="276" y="248" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">หงาย</text><rect x="334" y="196" width="80" height="70" rx="8" fill="#2f4b8f" stroke="#6b7280" stroke-width="1.5" /><text x="374" y="224" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">ใบที่ 4</text><text x="374" y="248" font-size="12" text-anchor="middle" font-weight="400" fill="#cbd5e1">คว่ำ</text><text x="374" y="284" font-size="10" text-anchor="middle" font-weight="700" fill="#15803d">ไพ่คุม</text><rect x="432" y="196" width="80" height="70" rx="8" fill="#2f4b8f" stroke="#6b7280" stroke-width="1.5" /><text x="472" y="224" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">ใบที่ 5</text><text x="472" y="248" font-size="12" text-anchor="middle" font-weight="400" fill="#cbd5e1">คว่ำ</text><rect x="530" y="196" width="80" height="70" rx="8" fill="#2f4b8f" stroke="#f59e0b" stroke-width="4" /><text x="570" y="224" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">ใบที่ 6</text><text x="570" y="248" font-size="12" text-anchor="middle" font-weight="400" fill="#cbd5e1">คว่ำ</text><rect x="628" y="196" width="80" height="70" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5" /><text x="668" y="224" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">ใบที่ 7</text><text x="668" y="248" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">หงาย</text><text x="30" y="316" font-size="12" text-anchor="start" font-weight="700" fill="#6b7280">กลุ่ม A = {1,3,5,7}: หงาย 2 (คู่ ✓)  ·  กลุ่ม B = {2,3,6,7}: หงาย 3 (คี่ ✗)  ·  กลุ่ม C = {4,5,6,7}: หงาย 1 (คี่ ✗)</text><rect x="30" y="328" width="700" height="32" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="349" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">คี่ที่กลุ่ม B (=2) และ C (=4) → ตำแหน่ง 2 + 4 = 6  (ตรวจครบ 16 × 8 กรณีแล้ว)</text></svg>