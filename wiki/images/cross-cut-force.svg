<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="330" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">Cross-Cut Force: บังคับให้คนดูได้ไพ่ใบที่เรารู้ (F)</text><circle cx="40" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="40" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="62" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">ไพ่ F อยู่บนสุด</text><rect x="40" y="90" width="90" height="24" rx="5" fill="#ffffff" stroke="#f59e0b" stroke-width="3" /><text x="85.0" y="107.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">F</text><rect x="40" y="116" width="90" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="85.0" y="133.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><rect x="40" y="142" width="90" height="24" rx="5" fill="#e8eefc" stroke="#9ca3af" stroke-width="1.2" /><text x="85.0" y="159.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">…</text><rect x="40" y="168" width="90" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="85.0" y="185.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><text x="85" y="214" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">คนดูตัดสำรับ</text><line x1="140" y1="140" x2="215" y2="140" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="230" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="230" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="252" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">กอง A ลงโต๊ะ</text><rect x="235" y="90" width="80" height="24" rx="5" fill="#ffffff" stroke="#f59e0b" stroke-width="3" /><text x="275.0" y="107.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">F</text><rect x="235" y="116" width="80" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="275.0" y="133.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><rect x="235" y="142" width="80" height="24" rx="5" fill="#e8eefc" stroke="#9ca3af" stroke-width="1.2" /><text x="275.0" y="159.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">…</text><text x="275" y="190" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">กอง A (บนมี F)</text><rect x="235" y="215" width="80" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="275.0" y="232.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><rect x="235" y="241" width="80" height="24" rx="5" fill="#e8eefc" stroke="#9ca3af" stroke-width="1.2" /><text x="275.0" y="258.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">…</text><rect x="235" y="267" width="80" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="275.0" y="284.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><text x="275" y="305" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">กอง B (ที่เหลือในมือ)</text><line x1="330" y1="250" x2="405" y2="200" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="430" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="430" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="452" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">วางกอง B 'ไขว้' ทับ A</text><rect x="440" y="120" width="120" height="22" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="452" y="136" font-size="12" text-anchor="start" font-weight="700" fill="#1f2937">A</text><rect x="500" y="82" width="24" height="100" rx="5" fill="#e8eefc" stroke="#6b7280" stroke-width="1.5" /><text x="512" y="108" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">B</text><text x="540" y="136" font-size="12" text-anchor="start" font-weight="700" fill="#15803d">F</text><text x="495" y="200" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">คุยต่ออีกสักพัก…</text><line x1="580" y1="140" x2="640" y2="140" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="655" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="655" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="677" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">ยก B ออก</text><rect x="640" y="100" width="90" height="26" rx="5" fill="#ffffff" stroke="#f59e0b" stroke-width="3" /><text x="685.0" y="118.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">F</text><text x="685" y="150" font-size="12" text-anchor="middle" font-weight="600" fill="#15803d">ใบที่อยู่ใต้ B</text><text x="685" y="168" font-size="12" text-anchor="middle" font-weight="600" fill="#15803d">คือ F เสมอ</text><rect x="430" y="250" width="300" height="56" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="580" y="274" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">ยกกอง B ออก → 'เลือก' ใบบนสุดของกอง A</text><text x="580" y="294" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">ปล่อยเวลาพอให้คนลืมว่าตัดตรงไหน</text></svg>