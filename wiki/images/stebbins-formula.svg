<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="340" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">Si Stebbins: ตำแหน่ง n → ไพ่ ได้ทันทีด้วยสูตร</text><text x="30" y="66" font-size="15" text-anchor="start" font-weight="700" fill="#1d4ed8">เลข = (3n − 2) mod 13   (ได้ 0 ให้ใช้ K)</text><text x="30" y="92" font-size="15" text-anchor="start" font-weight="700" fill="#1d4ed8">ดอก = ลำดับที่ (n − 1) mod 4  ในวงรอบ ♣ ♥ ♠ ♦</text><rect x="40" y="116" width="215" height="160" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" /><text x="147" y="142" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">ตำแหน่ง n = 20</text><text x="147" y="168" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">เลข: 3·20 − 2 = 58</text><text x="147" y="186" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">58 mod 13 = 6</text><text x="147" y="208" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">ดอก: (20−1) mod 4 = 3</text><rect x="118" y="220" width="40" height="50" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="124" y="239" font-size="16" text-anchor="start" font-weight="700" fill="#c62828">6♦</text><text x="138.0" y="256" font-size="28" text-anchor="middle" font-weight="400" fill="#c62828">♦</text><rect x="275" y="116" width="215" height="160" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" /><text x="382" y="142" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">ตำแหน่ง n = 33</text><text x="382" y="168" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">เลข: 3·33 − 2 = 97</text><text x="382" y="186" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">97 mod 13 = 6</text><text x="382" y="208" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">ดอก: (33−1) mod 4 = 0</text><rect x="353" y="220" width="40" height="50" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="359" y="239" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">6♣</text><text x="373.0" y="256" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♣</text><rect x="510" y="116" width="215" height="160" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" /><text x="617" y="142" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">ตำแหน่ง n = 52</text><text x="617" y="168" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">เลข: 3·52 − 2 = 154</text><text x="617" y="186" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">154 mod 13 = 11</text><text x="617" y="208" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">ดอก: (52−1) mod 4 = 3</text><rect x="588" y="220" width="40" height="50" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="594" y="239" font-size="16" text-anchor="start" font-weight="700" fill="#c62828">J♦</text><text x="608.0" y="256" font-size="28" text-anchor="middle" font-weight="400" fill="#c62828">♦</text><rect x="30" y="288" width="700" height="44" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="316" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">ให้ผู้ชมบอกเลขตำแหน่ง 1–52 → คุณบอกไพ่ในตำแหน่งนั้นได้ทันที (ตรวจครบ 52 ตำแหน่ง)</text></svg>