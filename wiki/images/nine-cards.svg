<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="360" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">ไพ่ 9 ใบ: คนดูเลือกไพ่ในใจ  →  ถามแค่ 2 ครั้ง  →  ใบที่ 5 เสมอ</text><text x="110" y="62" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">รอบที่ 1: แจก 9 ใบ (หงายหน้า)</text><text x="50" y="84" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">กอง A</text><rect x="28" y="92" width="44" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="50" y="113" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">1</text><rect x="28" y="132" width="44" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="50" y="153" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">4</text><rect x="28" y="172" width="44" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="50" y="193" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">7</text><text x="112" y="84" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">กอง B</text><rect x="90" y="92" width="44" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="112" y="113" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">2</text><rect x="90" y="132" width="44" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="112" y="153" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">5</text><rect x="90" y="172" width="44" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="112" y="193" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">8</text><text x="174" y="84" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">กอง C</text><rect x="152" y="92" width="44" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="174" y="113" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">3</text><rect x="152" y="132" width="44" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="174" y="153" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">6</text><rect x="152" y="172" width="44" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="174" y="193" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">9</text><text x="390" y="175" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">คนดูบอกว่าอยู่กองไหน →</text><line x1="215" y1="100" x2="275" y2="100" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><text x="375" y="62" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">เก็บ: กองที่ถูกเลือกไว้ 'ตรงกลาง'</text><rect x="285" y="85" width="180" height="30" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="375.0" y="105.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">กองอื่น (ใบ 1–3)</text><rect x="285" y="125" width="180" height="30" rx="5" fill="#fff3cd" stroke="#f59e0b" stroke-width="3" /><text x="375.0" y="145.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">กองที่เลือก (ใบ 4–6)</text><rect x="285" y="165" width="180" height="30" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="375.0" y="185.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">กองอื่น (ใบ 7–9)</text><text x="375" y="215" font-size="13" text-anchor="middle" font-weight="700" fill="#1d4ed8">ไพ่ในใจอยู่ตำแหน่ง 4, 5 หรือ 6</text><line x1="475" y1="130" x2="530" y2="130" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><text x="645" y="62" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">รอบที่ 2: แจกอีกครั้ง</text><text x="592" y="84" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">กอง A</text><rect x="550" y="92" width="44" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="572" y="113" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">·</text><rect x="550" y="132" width="44" height="32" rx="5" fill="#fff3cd" stroke="#f59e0b" stroke-width="2.5" /><text x="572" y="153" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">4</text><rect x="550" y="172" width="44" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="572" y="193" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">·</text><text x="654" y="84" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">กอง B</text><rect x="612" y="92" width="44" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="634" y="113" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">·</text><rect x="612" y="132" width="44" height="32" rx="5" fill="#fff3cd" stroke="#f59e0b" stroke-width="2.5" /><text x="634" y="153" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">5</text><rect x="612" y="172" width="44" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="634" y="193" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">·</text><text x="716" y="84" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">กอง C</text><rect x="674" y="92" width="44" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="696" y="113" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">·</text><rect x="674" y="132" width="44" height="32" rx="5" fill="#fff3cd" stroke="#f59e0b" stroke-width="2.5" /><text x="696" y="153" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">6</text><rect x="674" y="172" width="44" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="696" y="193" font-size="15" text-anchor="middle" font-weight="700" fill="#1f2937">·</text><text x="645" y="232" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">ใบที่ 4,5,6 ไปอยู่แถวกลางของแต่ละกอง</text><rect x="40" y="262" width="680" height="76" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="290" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d">คนดูบอกกองที่ 2  →  ไพ่ในใจคือ 'แถวกลาง' ของกองนั้น</text><text x="380" y="316" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">(เก็บกองนั้นไว้ตรงกลางอีกครั้ง → ไพ่ในใจคือใบที่ 5 ของสำรับ 9 ใบ)</text></svg>