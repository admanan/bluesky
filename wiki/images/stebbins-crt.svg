<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="360" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">Stebbins ย้อนกลับ: ไพ่ → ตำแหน่ง (Chinese Remainder)</text><text x="30" y="62" font-size="15" text-anchor="start" font-weight="700" fill="#1f2937">ตัวอย่าง: ผู้ชมหยิบ 8♦  → ไพ่นี้อยู่ตำแหน่งที่เท่าไร?</text><rect x="30" y="78" width="340" height="126" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5" /><text x="200.0" y="102" font-size="14" text-anchor="middle" font-weight="700" fill="#1d4ed8">① เลข → ตำแหน่งแบบวนรอบ 13</text><text x="200.0" y="128" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">n ≡ 9 × (ค่า + 2)  (mod 13)</text><text x="200.0" y="150" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">ค่า = 8:  9 × 10 = 90  →  90 mod 13 = 12</text><text x="200.0" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">ตัวเลือก: n = 12, 25, 38, 51</text><rect x="390" y="78" width="340" height="126" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5" /><text x="560.0" y="102" font-size="14" text-anchor="middle" font-weight="700" fill="#f59e0b">② ดอก → ตำแหน่งแบบวนรอบ 4</text><text x="560.0" y="128" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">ลำดับดอก ♣=0 ♥=1 ♠=2 ♦=3</text><text x="560.0" y="150" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">n ≡ ลำดับดอก + 1  (mod 4)</text><text x="560.0" y="172" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">♦: n ≡ 4 ≡ 0  (mod 4)</text><rect x="30" y="216" width="700" height="56" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="60" y="240" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">12  mod 4 = 0</text><text x="60" y="260" font-size="12" text-anchor="start" font-weight="700" fill="#15803d">✓ ตรง</text><text x="230" y="240" font-size="14" text-anchor="start" font-weight="700" fill="#6b7280">25  mod 4 = 1</text><text x="230" y="260" font-size="12" text-anchor="start" font-weight="700" fill="#6b7280">✗</text><text x="400" y="240" font-size="14" text-anchor="start" font-weight="700" fill="#6b7280">38  mod 4 = 2</text><text x="400" y="260" font-size="12" text-anchor="start" font-weight="700" fill="#6b7280">✗</text><text x="570" y="240" font-size="14" text-anchor="start" font-weight="700" fill="#6b7280">51  mod 4 = 3</text><text x="570" y="260" font-size="12" text-anchor="start" font-weight="700" fill="#6b7280">✗</text><rect x="30" y="288" width="700" height="52" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="312" font-size="16" text-anchor="middle" font-weight="700" fill="#15803d">8♦ = ตำแหน่งที่ 12 ของสำรับ</text><text x="380" y="332" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">ตรวจครบทุกใบ (52 ใบ) แล้ว: มีตัวเลือกเดียวเสมอ</text></svg>