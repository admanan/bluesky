<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="360" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">Josephus Shuffle: ทิ้งใบบนสุด ย้ายใบถัดไปไปล่าง ทำซ้ำ → เหลือใบเดียว</text><text x="30" y="62" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">ตัวอย่าง 10 ใบ (เลข = ตำแหน่งเดิมนับจากบน) ลำดับที่ถูกทิ้ง:</text><rect x="30" y="80" width="62" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="61" y="108" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">1</text><text x="61" y="134" font-size="11" text-anchor="middle" font-weight="700" fill="#6b7280">ทิ้งที่ 1</text><rect x="100" y="80" width="62" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="131" y="108" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">2</text><text x="131" y="134" font-size="11" text-anchor="middle" font-weight="700" fill="#6b7280">ทิ้งที่ 6</text><rect x="170" y="80" width="62" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="201" y="108" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">3</text><text x="201" y="134" font-size="11" text-anchor="middle" font-weight="700" fill="#6b7280">ทิ้งที่ 2</text><rect x="240" y="80" width="62" height="64" rx="6" fill="#fff3cd" stroke="#f59e0b" stroke-width="3" /><text x="271" y="108" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">4</text><text x="271" y="134" font-size="11" text-anchor="middle" font-weight="700" fill="#15803d">รอด!</text><rect x="310" y="80" width="62" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="341" y="108" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">5</text><text x="341" y="134" font-size="11" text-anchor="middle" font-weight="700" fill="#6b7280">ทิ้งที่ 3</text><rect x="380" y="80" width="62" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="411" y="108" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">6</text><text x="411" y="134" font-size="11" text-anchor="middle" font-weight="700" fill="#6b7280">ทิ้งที่ 7</text><rect x="450" y="80" width="62" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="481" y="108" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">7</text><text x="481" y="134" font-size="11" text-anchor="middle" font-weight="700" fill="#6b7280">ทิ้งที่ 4</text><rect x="520" y="80" width="62" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="551" y="108" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">8</text><text x="551" y="134" font-size="11" text-anchor="middle" font-weight="700" fill="#6b7280">ทิ้งที่ 9</text><rect x="590" y="80" width="62" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="621" y="108" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">9</text><text x="621" y="134" font-size="11" text-anchor="middle" font-weight="700" fill="#6b7280">ทิ้งที่ 5</text><rect x="660" y="80" width="62" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="691" y="108" font-size="18" text-anchor="middle" font-weight="700" fill="#1f2937">10</text><text x="691" y="134" font-size="11" text-anchor="middle" font-weight="700" fill="#6b7280">ทิ้งที่ 8</text><rect x="30" y="170" width="700" height="64" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2" /><text x="380" y="196" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">สูตร (สำหรับ n ใบ, n &gt; 1): ให้ m = 2 ยกกำลังสูงสุดที่ ≤ n − 1</text><text x="380" y="220" font-size="16" text-anchor="middle" font-weight="700" fill="#1d4ed8">ใบที่รอด = 2 × (n − 1 − m) + 2  (นับจากบนสุดก่อนเริ่ม)</text><text x="380" y="262" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">ตัวอย่าง: n = 10 → m = 8 → 2 × (9 − 8) + 2 = 4   ✓ (ภาพบน)</text><rect x="30" y="280" width="700" height="64" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="306" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d">n = 52 → m = 32 → 2 × (51 − 32) + 2 = 40</text><text x="380" y="328" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">ไพ่ใบที่ 40 จากบนสุดคือใบที่เหลือรอดเสมอ (ตรวจ n = 1–52 ด้วยการจำลองแล้ว)</text></svg>