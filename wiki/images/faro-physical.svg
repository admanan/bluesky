<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="330" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">Faro Shuffle (ลงมือจริง): สอดไพ่สองครึ่งให้สลับกันทีละใบ</text><circle cx="40" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="40" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="62" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">แบ่งครึ่ง 26 + 26 ถือมุมแนบกัน</text><g transform="rotate(-8 130 140)"><rect x="40" y="110" width="110" height="70" rx="6" fill="#2f4b8f" stroke="#1e2f5c"/></g><g transform="rotate(8 230 140)"><rect x="170" y="110" width="110" height="70" rx="6" fill="#2f4b8f" stroke="#1e2f5c"/></g><text x="95" y="210" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">มือซ้าย</text><text x="225" y="210" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">มือขวา</text><text x="160" y="235" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">นิ้วโป้งยกมุมด้านใน</text><line x1="300" y1="145" x2="360" y2="145" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="380" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="380" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="402" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">ดันเข้าหากัน ให้มุมไพ่ซ้อน</text><rect x="380" y="100" width="110" height="8" rx="2" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="400" y="110" width="110" height="8" rx="2" fill="#4f6fb5" stroke="#1e2f5c" stroke-width="1" /><rect x="380" y="120" width="110" height="8" rx="2" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="400" y="130" width="110" height="8" rx="2" fill="#4f6fb5" stroke="#1e2f5c" stroke-width="1" /><rect x="380" y="140" width="110" height="8" rx="2" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="400" y="150" width="110" height="8" rx="2" fill="#4f6fb5" stroke="#1e2f5c" stroke-width="1" /><rect x="380" y="160" width="110" height="8" rx="2" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="400" y="170" width="110" height="8" rx="2" fill="#4f6fb5" stroke="#1e2f5c" stroke-width="1" /><text x="450" y="200" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">ไพ่สองกองสอดสลับทีละใบ</text><line x1="510" y1="145" x2="570" y2="145" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="590" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="590" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="612" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">ผลลัพธ์</text><rect x="590" y="100" width="120" height="8" rx="2" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="590" y="110" width="120" height="8" rx="2" fill="#4f6fb5" stroke="#1e2f5c" stroke-width="1" /><rect x="590" y="120" width="120" height="8" rx="2" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="590" y="130" width="120" height="8" rx="2" fill="#4f6fb5" stroke="#1e2f5c" stroke-width="1" /><rect x="590" y="140" width="120" height="8" rx="2" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="590" y="150" width="120" height="8" rx="2" fill="#4f6fb5" stroke="#1e2f5c" stroke-width="1" /><rect x="590" y="160" width="120" height="8" rx="2" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="590" y="170" width="120" height="8" rx="2" fill="#4f6fb5" stroke="#1e2f5c" stroke-width="1" /><text x="650" y="210" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">สลับสนิททีละใบ: ใบบนสุดอยู่ที่เดิม = Out</text><text x="650" y="228" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">ใบบนสุดลงมาเป็นใบที่ 2 = In</text><rect x="30" y="252" width="700" height="56" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="276" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">ถ้าตัดได้ 26/26 พอดีแล้วสอดสลับสมบูรณ์ จะนำสูตรในหน้า Faro (คณิต) ไปใช้ได้ทันที</text><text x="380" y="296" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">ฝึกกับสำรับใหม่ ๆ เพราะต้องการขอบไพ่คม  ใช้เวลาฝึกหลายสัปดาห์</text></svg>