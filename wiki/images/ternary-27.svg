<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="400" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">ไพ่ 27 ใบ: คุมตำแหน่งปลายทางได้ทุกใบ (เลขฐาน 3)</text><text x="30" y="62" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">แต่ละรอบ: ผู้ชมบอกกองที่ไพ่อยู่ → คุณวางกองนั้นไว้ช่อง บน (0) / กลาง (1) / ล่าง (2)</text><text x="30" y="86" font-size="14" text-anchor="start" font-weight="700" fill="#1d4ed8">ตำแหน่งปลายทาง t (นับจาก 0) = 9·ช่องรอบ3 + 3·ช่องรอบ2 + ช่องรอบ1</text><text x="40" y="122" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">อยากให้ไพ่อยู่ใบที่</text><text x="300" y="122" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">รอบ 1</text><text x="440" y="122" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">รอบ 2</text><text x="580" y="122" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">รอบ 3</text><rect x="30" y="134" width="700" height="36" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="40" y="158" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">ใบที่ 1  (บนสุด)</text><text x="300" y="158" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">บน</text><text x="440" y="158" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">บน</text><text x="580" y="158" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">บน</text><rect x="30" y="178" width="700" height="36" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="40" y="202" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">ใบที่ 14  (กลางพอดี)</text><text x="300" y="202" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">กลาง</text><text x="440" y="202" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">กลาง</text><text x="580" y="202" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">กลาง</text><rect x="30" y="222" width="700" height="36" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="40" y="246" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">ใบที่ 21</text><text x="300" y="246" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">ล่าง</text><text x="440" y="246" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">บน</text><text x="580" y="246" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">ล่าง</text><rect x="30" y="266" width="700" height="36" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="40" y="290" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">ใบที่ 27  (ล่างสุด)</text><text x="300" y="290" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">ล่าง</text><text x="440" y="290" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">ล่าง</text><text x="580" y="290" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">ล่าง</text><rect x="30" y="320" width="700" height="66" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="346" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">ตรวจครบทุกตำแหน่งเริ่มต้น × ทุกตำแหน่งปลายทาง (27 × 27) แล้ว</text><text x="380" y="368" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">แจกหงายทีละใบเป็น 3 กอง → พลิกแต่ละกองคว่ำทั้งก้อน → ซ้อนตามช่องที่ต้องการ</text></svg>