<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="380" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">สี่เหลี่ยม 4×4 ของ A K Q J: ทุกกลุ่ม 4 ใบ มีครบ 4 เลข และครบ 4 ดอก</text><rect x="30" y="50" width="60" height="74" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="3.5" /><text x="36" y="69" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">A♠</text><text x="60.0" y="110" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><rect x="100" y="50" width="60" height="74" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="106" y="69" font-size="16" text-anchor="start" font-weight="700" fill="#c62828">K♥</text><text x="130.0" y="110" font-size="28" text-anchor="middle" font-weight="400" fill="#c62828">♥</text><rect x="170" y="50" width="60" height="74" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="176" y="69" font-size="16" text-anchor="start" font-weight="700" fill="#c62828">Q♦</text><text x="200.0" y="110" font-size="28" text-anchor="middle" font-weight="400" fill="#c62828">♦</text><rect x="240" y="50" width="60" height="74" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="3.5" /><text x="246" y="69" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">J♣</text><text x="270.0" y="110" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♣</text><rect x="30" y="132" width="60" height="74" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="36" y="151" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Q♣</text><text x="60.0" y="192"