h="1.3" /><text x="246" y="233" font-size="16" text-anchor="start" font-weight="700" fill="#c62828">A♦</text><text x="270.0" y="274" font-size="28" text-anchor="middle" font-weight="400" fill="#c62828">♦</text><rect x="30" y="296" width="60" height="74" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="3.5" /><text x="36" y="315" font-size="16" text-anchor="start" font-weight="700" fill="#c62828">K♦</text><text x="60.0" y="356" font-size="28" text-anchor="middle" font-weight="400" fill="#c62828">♦</text><rect x="100" y="296" width="60" height="74" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="106" y="315" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">A♣</text><text x="130.0" y="356" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♣</text><rect x="170" y="296" width="60" height="74" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="176" y="315" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">J♠</text><text x="200.0" y="356" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><rect x="240" y="296" width="60" height="74" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="3.5" /><text x="246" y="315" font-size="16" text-anchor="start" font-weight="700" fill="#c62828">Q♥</text><text x="270.0" y="356" font-size="28" text-anchor="middle" font-weight="400" fill="#c62828">♥</text><text x="330" y="66" font-size="14" text-anchor="start" font-weight="700" fill="#1d4ed8">กลุ่มที่ใช้ได้ (24 กลุ่ม ตรวจด้วยโค้ดแล้ว)</text><text x="330" y="94" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">• 4 แถว และ 4 สดมภ์</text><text x="330" y="120" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">• 2 แนวทแยง</text><text x="330" y="146" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">• 4 มุมของตาราง (กรอบทองในภาพ)</text><text x="330" y="172" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">• 4 ช่องแต่ละมุมใหญ่ (2×2) ทั้ง 4 มุม</text><text x="330" y="198" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">• 4 ช่องกลาง (2×2)</text><text x="330" y="224" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">• 4 ช่อง: แถวที่ 1, 3 × สดมภ์ที่ 1, 3</text><text x="330" y="250" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">• อีก 7 รูปแบบ (ทั้งหมดรวม 24 กลุ่ม)</text><rect x="330" y="290" width="400" height="66" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="530" y="316" font-size="12" text-anchor="middle" font-weight="700" fill="#c62828">บล็อก 2×2 อื่น ๆ (เช่น ตรงกลางแถวบน) ใช้ไม่ได้</text><text x="530" y="338" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">ให้ผู้ชมเลือกจาก 24 กลุ่มข้างบนเท่านั้น</text></svg>