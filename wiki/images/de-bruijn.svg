f"></text><circle cx="249.74884620746167" cy="350.1043392264673" r="10" fill="#1f2937" stroke="none"/><text x="249.74884620746167" y="354.1043392264673" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="225.36174186209672" cy="357.50208645242" r="10" fill="#c62828" stroke="none"/><text x="225.36174186209672" y="361.50208645242" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="200.0" cy="360.0" r="10" fill="#1f2937" stroke="none"/><text x="200.0" y="364.0" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="174.6382581379033" cy="357.50208645242" r="10" fill="#1f2937" stroke="none"/><text x="174.6382581379033" y="361.50208645242" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="150.25115379253833" cy="350.1043392264673" r="10" fill="#c62828" stroke="none"/><text x="150.25115379253833" y="354.1043392264673" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="127.77586970745175" cy="338.0910495993309" r="10" fill="#c62828" stroke="none"/><text x="127.77586970745175" y="342.0910495993309" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="108.07611844574883" cy="321.9238815542512" r="10" fill="#c62828" stroke="none"/><text x="108.07611844574883" y="325.9238815542512" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="91.9089504006691" cy="302.2241302925483" r="10" fill="#1f2937" stroke="none"/><text x="91.9089504006691" y="306.2241302925483" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="79.89566077353275" cy="279.7488462074617" r="10" fill="#c62828" stroke="none"/><text x="79.89566077353275" y="283.7488462074617" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="72.49791354758004" cy="255.36174186209672" r="10" fill="#1f2937" stroke="none"/><text x="72.49791354758004" y="259.3617418620967" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="70.0" cy="230.00000000000003" r="10" fill="#c62828" stroke="none"/><text x="70.0" y="234.00000000000003" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="72.49791354758004" cy="204.6382581379033" r="10" fill="#c62828" stroke="none"/><text x="72.49791354758004" y="208.6382581379033" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="79.89566077353274" cy="180.25115379253828" r="10" fill="#1f2937" stroke="none"/><text x="79.89566077353274" y="184.25115379253828" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="91.90895040066908" cy="157.77586970745176" r="10" fill="#c62828" stroke="none"/><text x="91.90895040066908" y="161.77586970745176" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="108.0761184457488" cy="138.07611844574882" r="10" fill="#c62828" stroke="none"/><text x="108.0761184457488" y="142.07611844574882" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="127.77586970745172" cy="121.90895040066911" r="10" fill="#c62828" stroke="none"/><text x="127.77586970745172" y="125.90895040066911" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="150.25115379253825" cy="109.89566077353275" r="10" fill="#c62828" stroke="none"/><text x="150.25115379253825" y="113.89566077353275" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><circle cx="174.63825813790328" cy="102.49791354758005" r="10" fill="#c62828" stroke="none"/><text x="174.63825813790328" y="106.49791354758005" font-size="10" text-anchor="middle" font-weight="700" fill="#fff"></text><text x="200" y="224" font-size="16" text-anchor="middle" font-weight="700" fill="#1f2937">32 ใบ</text><text x="200" y="246" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">แดง 16 · ดำ 16</text><text x="400" y="80" font-size="13" text-anchor="start" font-weight="700" fill="#1d4ed8">ลำดับสี (บน → ล่าง) 1 = แดง, 0 = ดำ</text><text x="400" y="106" font-size="17" text-anchor="start" font-weight="700" fill="#1f2937">00000100011001010011101011011111</text><text x="400" y="146" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">วงรอบ: ใบที่ 32 ต่อกับใบที่ 1 (ตัดสำรับก็ยังเป็นวงเดิม)</text><text x="400" y="182" font-size="13" text-anchor="start" font-weight="700" fill="#1d4ed8">วิธีใช้:</text><text x="400" y="208" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">• ผู้ชมตัดสำรับ แล้วหยิบ 5 ใบบนสุด (คนละใบ)</text><text x="400" y="232" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">• แต่ละคนบอกแค่ 'สี' ของใบตัวเอง</text><text x="400" y="256" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">• 5 สีนั้นบอกตำแหน่งเริ่มต้นในวงรอบ ได้ 1 แบบเท่านั้น</text><text x="400" y="280" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">• → รู้ว่าทั้ง 5 ใบคืออะไร (ถ้ามีตารางสำรับ)</text><rect x="400" y="320" width="330" height="70" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="565" y="348" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">รูปแบบสี 5 ตัวมีได้ 2⁵ = 32 แบบ</text><text x="565" y="370" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">ตรงกับ 32 ตำแหน่งเริ่มต้นพอดี (ตรวจแล้ว)</text></svg>