<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="320" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">เลข 1001: ไพ่ 3 ใบ เขียนซ้ำ แล้วหาร 7, 11, 13 → ได้ไพ่เดิมกลับมา</text><rect x="24" y="60" width="136" height="90" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5" /><text x="92" y="86" font-size="13" text-anchor="middle" font-weight="700" fill="#1d4ed8">① ไพ่ 3 ใบ</text><text x="92" y="114" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">4  7  2  →  472</text><line x1="162" y1="105" x2="170" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="170" y="60" width="136" height="90" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5" /><text x="238" y="86" font-size="13" text-anchor="middle" font-weight="700" fill="#1d4ed8">② เขียนซ้ำ</text><text x="238" y="114" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">472472</text><line x1="308" y1="105" x2="316" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="316" y="60" width="136" height="90" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5" /><text x="384" y="86" font-size="13" text-anchor="middle" font-weight="700" fill="#1d4ed8">③ ÷ 7</text><text x="384" y="114" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">472472 ÷ 7</text><text x="384" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">67496</text><line x1="454" y1="105" x2="462" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="462" y="60" width="136" height="90" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5" /><text x="530" y="86" font-size="13" text-anchor="middle" font-weight="700" fill="#1d4ed8">④ ÷ 11</text><text x="530" y="114" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">67496 ÷ 11</text><text x="530" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">6136</text><line x1="600" y1="105" x2="608" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="608" y="60" width="136" height="90" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2.5" /><text x="676" y="86" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">⑤ ÷ 13</text><text x="676" y="114" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">6136 ÷ 13</text><text x="676" y="136" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">472</text><rect x="30" y="176" width="700" height="122" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="204" font-size="14" text-anchor="middle" font-weight="700" fill="#15803d">ทำไมถึงได้ผล: เลขซ้ำ 6 หลัก = เลข 3 หลัก × 1001</text><text x="380" y="232" font-size="16" text-anchor="middle" font-weight="700" fill="#15803d">และ 1001 = 7 × 11 × 13</text><text x="380" y="262" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">จึงหารด้วย 7, 11, 13 ทีละตัว (ลำดับไหนก็ได้) ลงตัวทุกครั้ง ผลสุดท้ายคือเลขเดิม</text><text x="380" y="284" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">(ตรวจทุกเลข 100–999 แล้ว)</text></svg>