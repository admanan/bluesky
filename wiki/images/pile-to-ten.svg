<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="330" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">กองถึง 10: ทายจำนวนไพ่ที่เหลือจากผลรวมไพ่หงาย</text><text x="30" y="62" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">แต่ละแถว: ไพ่หงาย v ใบ + ไพ่คว่ำอีก (10 − v) ใบ (แถวละ 11 − v ใบ) · A ได้แถวยาวสุด 10 ใบ, 10 ได้แถวสั้นสุด 1 ใบ</text><rect x="30" y="78" width="34" height="24" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" /><text x="47" y="95" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">4</text><rect x="70" y="78" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="94" y="78" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="118" y="78" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="142" y="78" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="166" y="78" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="190" y="78" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="30" y="106" width="34" height="24" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" /><text x="47" y="123" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">6</text><rect x="70" y="106" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="94" y="106" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="118" y="106" width="20"