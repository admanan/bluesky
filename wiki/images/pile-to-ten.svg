oke-width="1" /><rect x="238" y="162" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="30" y="190" width="34" height="24" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" /><text x="47" y="207" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">6</text><rect x="70" y="190" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="94" y="190" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="118" y="190" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="142" y="190" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="30" y="218" width="34" height="24" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" /><text x="47" y="235" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">10</text><rect x="30" y="246" width="34" height="24" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" /><text x="47" y="263" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">4</text><rect x="70" y="246" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="94" y="246" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="118" y="246" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="142" y="246" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="166" y="246" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="190" y="246" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="30" y="274" width="34" height="24" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" /><text x="47" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">2</text><rect x="70" y="274" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="94" y="274" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="118" y="274" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="142" y="274" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="166" y="274" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="190" y="274" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="214" y="274" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><rect x="238" y="274" width="20" height="24" rx="3" fill="#2f4b8f" stroke="#1e2f5c" stroke-width="1" /><text x="420" y="100" font-size="16" text-anchor="start" font-weight="700" fill="#1d4ed8">แถว (P) = 8</text><text x="420" y="128" font-size="14" text-anchor="start" font-weight="700" fill="#1d4ed8">ผลรวมไพ่หงาย (S) = 4+6+3+2+6+10+4+2 = 37</text><rect x="420" y="150" width="310" height="140" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="575" y="178" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d">ไพ่ที่เหลือ = 52 − 11 × P + S</text><text x="575" y="208" font-size="14" text-anchor="middle" font-weight="700" fill="#15803d">= 52 − 11 × 8 + 37</text><text x="575" y="238" font-size="18" text-anchor="middle" font-weight="700" fill="#15803d">= 1 ใบ</text><text x="575" y="268" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">ไพ่ที่ 'นับไม่ครบ' ก็นับเป็นไพ่ที่เหลือ</text><text x="30" y="316" font-size="12" text-anchor="start" font-weight="600" fill="#6b7280">J Q K = 10 · A = 1  ·  ตรวจกับสำรับสุ่ม 3,000 ชุดแล้ว</text></svg>