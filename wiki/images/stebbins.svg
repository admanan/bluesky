chor="middle" font-weight="400" fill="#6b7280">ใบที่ 13</text><text x="380" y="276" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">สูตร: ใบถัดไป = เลข +3 (K→A วนรอบ: K+3 = 3)  และ  ดอกถัดไปตามลำดับ ♣→♥→♠→♦→♣</text><rect x="40" y="292" width="680" height="50" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="313" font-size="14" text-anchor="middle" font-weight="700" fill="#15803d">ตัวอย่าง: ไพ่คีย์ที่แอบดู = 10♦  →  ไพ่ที่คนดูหยิบ = เลข 10+3 = K, ดอกต่อจาก ♦ = ♣  →  K♣</text><text x="380" y="332" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">(สำรับ 52 ใบเรียงวนไม่ซ้ำ จึงตัดกี่ครั้งก็ยังเรียงต่อกันเสมอ)</text></svg>