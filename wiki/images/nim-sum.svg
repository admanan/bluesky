<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="360" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">Nim สามกอง: เขียนจำนวนไพ่เป็นเลขฐาน 2 แล้ว XOR — ถ้าเป็น 0 ใครเดินต่อก็แพ้</text><text x="30" y="62" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">กติกา: ผลัดกันหยิบไพ่ (กี่ใบก็ได้) จาก 'กองเดียว' ผู้หยิบใบสุดท้ายชนะ</text><text x="30" y="92" font-size="13" text-anchor="start" font-weight="700" fill="#1d4ed8">ตัวอย่างกอง 3, 4, 5</text><text x="40" y="126" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">กอง 1: 3</text><rect x="180" y="106" width="40" height="26" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="200" y="125" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">0</text><rect x="226" y="106" width="40" height="26" rx="4" fill="#fff3cd" stroke="#9ca3af" stroke-width="1.2" /><text x="246" y="125" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">1</text><rect x="272" y="106" width="40" height="26" rx="4" fill="#fff3cd" stroke="#9ca3af" stroke-width="1.2" /><text x="292" y="125" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">1</text><text x="40" y="156" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">กอง 2: 4</text><rect x="180" y="136" width="40" height="26" rx="4" fill="#fff3cd" stroke="#9ca3af" stroke-width="1.2" /><text x="200" y="155" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">1</text><rect x="226" y="136" width="40" height="26" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="246" y="155" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">0</text><rect x="272" y="136" width="40" height="26" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="292" y="155" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">0</text><text x="40" y="186" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">กอง 3: 5</text><rect x="180" y="166" width="40" height="26" rx="4" fill="#fff3cd" stroke="#9ca3af" stroke-width="1.2" /><text x="200" y="185" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">1</text><rect x="226" y="166" width="40" height="26" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="246" y="185" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">0</text><rect x="272" y="166" width="40" height="26" rx="4" fill="#fff3cd" stroke="#9ca3af" stroke-width="1.2" /><text x="292" y="185" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">1</text><text x="40" y="206" font-size="13" text-anchor="start" font-weight="700" fill="#c62828">XOR ทั้งหมด</text><rect x="180" y="188" width="40" height="26" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="1.5" /><text x="200" y="207" font-size="14" text-anchor="middle" font-weight="700" fill="#c62828">0</text><rect x="226" y="188" width="40" height="26" rx="4" fill="#fecaca" stroke="#c62828" stroke-width="1.5" /><text x="246" y="207" font-size="14" text-anchor="middle" font-weight="700" fill="#c62828">1</text><rect x="272" y="188" width="40" height="26" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="1.5" /><text x="292" y="207" font-size="14" text-anchor="middle" font-weight="700" fill="#c62828">0</text><text x="380" y="126" font-size="13" text-anchor="start" font-weight="700" fill="#15803d">ถึงตาคุณ และ XOR ≠ 0  →  หาทางเดินให้ XOR = 0</text><text x="380" y="152" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">หากอง p ที่ p XOR 2 &lt; p:  3 XOR 2 = 1  (&lt; 3)  ✓</text><text x="380" y="176" font-size="13" text-anchor="start" font-weight="700" fill="#15803d">→ ลดกอง 1 จาก 3 เหลือ 1 (หยิบ 2 ใบ)</text><text x="380" y="204" font-size="13" text-anchor="start" font-weight="700" fill="#15803d">กองใหม่ 1, 4, 5 → XOR = 1 ⊕ 4 ⊕ 5 = 0 ✓</text><rect x="30" y="240" width="700" height="100" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="268" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">XOR = 0 → ฝ่ายที่ต้องเดินต่อ 'แพ้' ถ้าอีกฝ่ายเล่นถูก · XOR ≠ 0 → ฝ่ายที่ต้องเดินต่อ 'ชนะ'</text><text x="380" y="294" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">ตรวจทุกกอง (a, b, c ≤ 7) ด้วยการค้นหาเกมเต็มแล้ว</text><text x="380" y="318" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">หมายเหตุ: กติกา 'ผู้หยิบใบสุดท้ายแพ้' (misère) กลยุทธ์ต่างออกไป</text></svg>