oke-width="1.1" /><text x="187" y="283" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">4</text><text x="307" y="60" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Out-shuffle</text><rect x="285" y="70" width="44" height="24" rx="4" fill="#fff3cd" stroke="#f59e0b" stroke-width="2" /><text x="307" y="87" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">1</text><rect x="285" y="98" width="44" height="24" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1" /><text x="307" y="115" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">5</text><rect x="285" y="126" width="44" height="24" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1" /><text x="307" y="143" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">2</text><rect x="285" y="154" width="44" height="24" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1" /><text x="307" y="171" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">6</text><rect x="285" y="182" width="44" height="24" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1" /><text x="307" y="199" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">3</text><rect x="285" y="210" width="44" height="24" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1" /><text x="307" y="227" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">7</text><rect x="285" y="238" width="44" height="24" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1" /><text x="307" y="255" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">4</text><rect x="285" y="266" width="44" height="24" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1" /><text x="307" y="283" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">8</text><text x="187" y="322" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">In: ใบ 1 ไปตำแหน่ง 2</text><text x="307" y="322" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">Out: ใบ 1 อยู่ที่เดิม</text><rect x="360" y="56" width="372" height="150" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="372" y="80" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">สำรับ 52 ใบ (ตำแหน่งนับจากบน = p)</text><text x="372" y="106" font-size="14" text-anchor="start" font-weight="600" fill="#1d4ed8">In-shuffle :  p  →  (2·p) mod 53</text><text x="372" y="128" font-size="14" text-anchor="start" font-weight="600" fill="#1d4ed8">Out-shuffle :  p  →  (2·p − 1) mod 51   (ใบล่างสุดอยู่ที่เดิม)</text><text x="372" y="156" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">ตัวอย่าง In: p=27 → 54 mod 53 = 1  (ใบที่ 27 ขึ้นบนสุด)</text><text x="372" y="178" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">ตัวอย่าง Out: p=27 → 53 mod 51 = 2</text><rect x="360" y="218" width="372" height="130" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="372" y="242" font-size="13" text-anchor="start" font-weight="700" fill="#15803d">ข้อเท็จจริงที่ใช้โชว์</text><text x="372" y="268" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">• Out-shuffle สมบูรณ์ 8 ครั้ง → สำรับกลับเป็นลำดับเดิม</text><text x="372" y="294" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">• In-shuffle สมบูรณ์ 52 ครั้ง → กลับเป็นลำดับเดิม</text><text x="372" y="320" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">• In-shuffle 26 ครั้ง → สำรับกลับหัวทั้งสำรับ</text></svg>