<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="300" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">ไพ่ที่หายไป (Missing Card): A–K ดอกเดียวกัน รวมกัน = 91</text><rect x="22" y="60" width="50" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="28" y="79" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">A♠</text><text x="47.0" y="116" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><rect x="78" y="60" width="50" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="84" y="79" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">2♠</text><text x="103.0" y="116" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><rect x="134" y="60" width="50" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="140" y="79" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">3♠</text><text x="159.0" y="116" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><rect x="190" y="60" width="50" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="196" y="79" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">4♠</text><text x="215.0" y="116" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><rect x="246" y="60" width="50" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="252" y="79" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">5♠</text><text x="271.0" y="116" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><rect x="302" y="60" width="50" height="70" rx="6" fill="#fff3cd" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6 4"/><text x="327" y="102" font-size="26" text-anchor="middle" font-weight="700" fill="#c62828">?</text><rect x="358" y="60" width="50" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="364" y="79" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">7♠</text><text x="383.0" y="116" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><rect x="414" y="60" width="50" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="420" y="79" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">8♠</text><text x="439.0" y="116" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><rect x="470" y="60" width="50" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="476" y="79" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">9♠</text><text x="495.0" y="116" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><rect x="526" y="60" width="50" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="532" y="79" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">10♠</text><text x="551.0" y="116" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><rect x="582" y="60" width="50" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="588" y="79" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">J♠</text><text x="607.0" y="116" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><rect x="638" y="60" width="50" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="644" y="79" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">Q♠</text><text x="663.0" y="116" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><rect x="694" y="60" width="50" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="700" y="79" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">K♠</text><text x="719.0" y="116" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><text x="30" y="156" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">① ผู้ชมแอบหยิบไพ่ 1 ใบ (ที่ซ่อน)   ·   ทั้งชุดรวม 1+2+…+13 = 91</text><text x="30" y="182" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">② บวกค่าไพ่ที่เหลือบนโต๊ะ (A=1, J=11, Q=12, K=13) = 85</text><rect x="30" y="214" width="700" height="62" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="240" font-size="20" text-anchor="middle" font-weight="700" fill="#15803d">ไพ่ที่หาย = 91 − 85 = 6</text><text x="380" y="264" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">ฝึกบวกเป็นคู่ที่รวม 13 (A+Q, 2+J, 3+10, 4+9, 5+8, 6+7) จะไวขึ้นมาก</text></svg>