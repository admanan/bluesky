<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="380" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">Faro Binary: นำไพ่บนสุดไปตำแหน่งใดก็ได้ ด้วย In/Out ตามเลขฐานสอง</text><text x="30" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#1d4ed8">กฎ: In-shuffle = ตำแหน่ง → 2i + 1   ·   Out-shuffle = ตำแหน่ง → 2i   (i นับจาก 0, เมื่อ i &lt; 26)</text><text x="30" y="86" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">เขียนตำแหน่งปลายทาง t (นับจาก 0) เป็นเลขฐานสอง  → บิต 1 = In, บิต 0 = Out (อ่านจากซ้ายไปขวา)</text><rect x="30" y="112" width="700" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="42" y="134" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">ใบที่ 27  (t = 26 = 11010₂)</text><text x="42" y="154" font-size="13" text-anchor="start" font-weight="700" fill="#15803d">In  →  In  →  Out  →  In  →  Out</text><text x="724" y="154" font-size="12" text-anchor="end" font-weight="400" fill="#6b7280">ตำแหน่งที่เปลี่ยน: 1 → 2 → 4 → 7 → 14 → 27</text><rect x="30" y="174" width="700" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="42" y="196" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">ใบที่ 12  (t = 11 = 1011₂)</text><text x="42" y="216" font-size="13" text-anchor="start" font-weight="700" fill="#15803d">In  →  Out  →  In  →  In</text><text x="724" y="216" font-size="12" text-anchor="end" font-weight="400" fill="#6b7280">ตำแหน่งที่เปลี่ยน: 1 → 2 → 3 → 6 → 12</text><rect x="30" y="236" width="700" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="42" y="258" font-size="14" text-anchor="start" font-weight="700" fill="#1f2937">ใบที่ 40  (t = 39 = 100111₂)</text><text x="42" y="278" font-size="13" text-anchor="start" font-weight="700" fill="#15803d">In  →  Out  →  Out  →  In  →  In  →  In</text><text x="724" y="278" font-size="12" text-anchor="end" font-weight="400" fill="#6b7280">ตำแหน่งที่เปลี่ยน: 1 → 2 → 3 → 5 → 10 → 20 → 40</text><rect x="30" y="304" width="700" height="62" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="328" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">ไพ่อยู่ตำแหน่ง p ไม่ใช่บนสุด? ตัดสำรับ (ย้ายบน p−1 ใบไปล่าง) ให้ไพ่ขึ้นบนก่อน แล้วค่อย Faro</text><text x="380" y="350" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">ตรวจครบทุกตำแหน่ง 1–52 ด้วยการจำลอง Faro จริงบนสำรับ 52 ใบ</text></svg>