or="middle" font-weight="600" fill="#1f2937">9♠</text><rect x="660" y="238" width="62" height="30" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="691.0" y="258.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">10♠</text><text x="30" y="232" font-size="11" text-anchor="start" font-weight="400" fill="#6b7280">หลังย้าย 3 ใบ → ใบบนสุดคือ A  (เปิดทิ้งออกไป แล้วสะกดคำต่อไป)</text><rect x="30" y="282" width="700" height="36" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="305" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">ทำซ้ำ: TWO(3) → 2, THREE(5) → 3 … TEN(3) → 10 (ตรวจด้วยโค้ดแล้ว)</text></svg>