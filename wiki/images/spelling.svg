<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="330" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">ไพ่สะกดชื่อ: สะกด O-N-E แล้วไพ่ที่เปิดคือ A, T-W-O → 2 …</text><text x="30" y="62" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">① จัดไพ่ 10 ใบ (บน → ล่าง) ล่วงหน้า  (A = 1)</text><rect x="30" y="76" width="62" height="34" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="61.0" y="98.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">4♠</text><text x="61" y="128" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ใบที่ 1</text><rect x="100" y="76" width="62" height="34" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="131.0" y="98.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">9♠</text><text x="131" y="128" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ใบที่ 2</text><rect x="170" y="76" width="62" height="34" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="201.0" y="98.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">10♠</text><text x="201" y="128" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ใบที่ 3</text><rect x="240" y="76" width="62" height="34" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="271.0" y="98.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">A♠</text><text x="271" y="128" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ใบที่ 4</text><rect x="310" y="76" width="62" height="34" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="341.0" y="98.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">3♠</text><text x="341" y="128" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ใบที่ 5</text><rect x="380" y="76" width="62" height="34" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="411.0" y="98.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">6♠</text><text x="411" y="128" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ใบที่ 6</text><rect x="450" y="76" width="62" height="34" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="481.0" y="98.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">8♠</text><text x="481" y="128" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ใบที่ 7</text><rect x="520" y="76" width="62" height="34" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="551.0" y="98.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">2♠</text><text x="551" y="128" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ใบที่ 8</text><rect x="590" y="76" width="62" height="34" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="621.0" y="98.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">5♠</text><text x="621" y="128" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ใบที่ 9</text><rect x="660" y="76" width="62" height="34" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="691.0" y="98.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">7♠</text><text x="691" y="128" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ใบที่ 10</text><text x="30" y="160" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">② สะกด ONE: ย้ายไพ่จาก 'บน → ล่าง' ทีละใบ ตามจำนวนตัวอักษร (3 ตัว = 3 ใบ)</text><rect x="30" y="