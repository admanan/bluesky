<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="340" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">เกมจับไพ่ชนะเสมอ: ผลัดกันหยิบ 1–3 ใบ  ผู้หยิบใบสุดท้ายชนะ</text><text x="30" y="62" font-size="15" text-anchor="start" font-weight="700" fill="#1d4ed8">กลยุทธ์ (หยิบใบสุดท้ายชนะ): หยิบให้เหลือ 'จำนวนที่หาร 4 ลงตัว' ทุกครั้ง</text><rect x="40" y="84" width="100" height="56" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="2" /><text x="90" y="118" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d">เหลือ 20</text><line x1="142" y1="112" x2="156" y2="112" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="158" y="84" width="100" height="56" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="2" /><text x="208" y="118" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d">เหลือ 16</text><line x1="260" y1="112" x2="274" y2="112" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="276" y="84" width="100" height="56" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="2" /><text x="326" y="118" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d">เหลือ 12</text><line x1="378" y1="112" x2="392" y2="112" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="394" y="84" width="100" height="56" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="2" /><text x="444" y="118" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d">เหลือ 8</text><line x1="496" y1="112" x2="510" y2="112" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="512" y="84" width="100" height="56" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="2" /><text x="562" y="118" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d">เหลือ 4</text><line x1="614" y1="112" x2="628" y2="112" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="630" y="84" width="100" height="56" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="2" /><text x="680" y="118" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d">เหลือ 0</text><text x="40" y="166" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">คู่ต่อสู้หยิบ x ใบ (1–3) → คุณหยิบ 4 − x ใบ  (รวมแต่ละรอบ = 4 ใบ)</text><rect x="30" y="186" width="340" height="130" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" /><text x="200" y="212" font-size="14" text-anchor="middle" font-weight="700" fill="#1d4ed8">เริ่มต้นกี่ใบดี?</text><text x="48" y="240" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">• เริ่ม 20 หรือ 24 ใบ (หาร 4 ลงตัว): ให้ผู้ชมเดินก่อน</text><text x="48" y="262" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">• เริ่ม 21 ใบ: คุณเดินก่อน หยิบ 1 ใบ</text><text x="48" y="284" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">• เริ่ม 22 / 23 ใบ: คุณเดินก่อน หยิบ 2 / 3 ใบ</text><rect x="390" y="186" width="340" height="130" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" /><text x="560" y="212" font-size="14" text-anchor="middle" font-weight="700" fill="#b45309">แบบกลับกัน: ใครหยิบใบสุดท้าย 'แพ้'</text><text x="408" y="240" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">• ต้องเหลือ  4k + 1  (1, 5, 9, 13, 17, 21)</text><text x="408" y="262" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">• เริ่ม 21 ใบ: ให้ผู้ชมเดินก่อน แล้วคุณทำรอบละ 4</text><text x="408" y="284" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">• ตรวจด้วยโปรแกรมทุกจำนวนถึง 60 ใบ</text></svg>