<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="340" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">เลข 1089 ด้วยไพ่ 3 ใบ: ผลลัพธ์ 1089 เสมอ</text><rect x="30" y="56" width="340" height="104" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" /><text x="200" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#1d4ed8">① ไพ่ 3 ใบ เรียงเป็นเลข</text><text x="200" y="118" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">7  3  2  →  732</text><text x="200" y="144" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">(ไพ่ใบแรกกับใบสุดท้ายต้องต่างกัน; A=1…9)</text><rect x="390" y="56" width="340" height="104" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" /><text x="560" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#1d4ed8">② กลับด้านเป็น</text><text x="560" y="118" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">237</text><text x="560" y="144" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280"></text><rect x="30" y="176" width="340" height="104" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" /><text x="200" y="202" font-size="13" text-anchor="middle" font-weight="700" fill="#1d4ed8">③ ลบ (ใหญ่ − เล็ก)</text><text x="200" y="238" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">732 − 237 = 495</text><text x="200" y="264" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">ถ้าได้ 2 หลัก ให้เติม 0 หน้า เช่น 099</text><rect x="390" y="176" width="340" height="104" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" /><text x="560" y="202" font-size="13" text-anchor="middle" font-weight="700" fill="#1d4ed8">④ กลับด้านผลลบ แล้วบวก</text><text x="560" y="238" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">495 + 594 = 1089</text><text x="560" y="264" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280"></text><rect x="30" y="300" width="700" height="30" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="321" font-size="12" text-anchor="middle" font-weight="700" fill="#15803d">เพิ่มลูกเล่น: ให้บอกแค่ 'หลักร้อย' ของผลลบ (4) → คุณรู้ทั้งหมด 4 9 5 (หลักสิบเป็น 9 เสมอ, หลักหน่วย = 9 − หลักร้อย)</text></svg>