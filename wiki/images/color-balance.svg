<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="330" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">สมดุลสี: แจกครึ่งสำรับ → แดงในกอง A = ดำในกอง B เสมอ</text><text x="190" y="66" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">กอง A (26 ใบ)</text><rect x="60" y="80" width="150.0" height="40" rx="4" fill="#fecaca" stroke="#c62828" stroke-width="1.5" /><text x="135.0" y="106" font-size="14" text-anchor="middle" font-weight="700" fill="#c62828">แดง 15</text><rect x="210.0" y="80" width="110.0" height="40" rx="4" fill="#d1d5db" stroke="#1f2937" stroke-width="1.5" /><text x="265.0" y="106" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">ดำ 11</text><text x="530" y="66" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">กอง B (26 ใบ)</text><rect x="400" y="80" width="110.0" height="40" rx="4" fill="#fecaca" stroke="#c62828" stroke-width="1.5" /><text x="455.0" y="106" font-size="14" text-anchor="middle" font-weight="700" fill="#c62828">แดง 11</text><rect x="510.0" y="80" width="150.0" height="40" rx="4" fill="#d1d5db" stroke="#1f2937" stroke-width="1.5" /><text x="585.0" y="106" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">ดำ 15</text><text x="130" y="156" font-size="20" text-anchor="middle" font-weight="700" fill="#c62828">แดง 15</text><text x="470" y="156" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">ดำ 15</text><text x="300" y="156" font-size="22" text-anchor="middle" font-weight="700" fill="#15803d">=</text><rect x="30" y="190" width="700" height="110" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="218" font-size="14" text-anchor="middle" font-weight="700" fill="#15803d">ทำไม? ทั้งสำรับมีแดง 26 ใบ</text><text x="380" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">แดงที่ไม่ได้อยู่กอง A ต้องอยู่กอง B  →  แดงกอง B = 26 − แดงกอง A</text><text x="380" y="268" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937">และกอง B มี 26 ใบ  →  ดำกอง B = 26 − แดงกอง B = แดงกอง A</text><text x="380" y="290" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">(ตัวเลขในภาพเป็นตัวอย่าง: ผลจริงจะเป็นเท่าไรก็ได้ แต่สองค่านี้เท่ากันเสมอ)</text></svg>