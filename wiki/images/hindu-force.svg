<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="320" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">Hindu Shuffle Force: ใบ F อยู่ล่างสุด คนดูสั่ง 'หยุด' เมื่อไรก็ได้</text><circle cx="40" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="40" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="62" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">มือขวาถือสำรับ</text><rect x="40" y="90" width="110" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="95.0" y="107.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><rect x="40" y="116" width="110" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="95.0" y="133.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><rect x="40" y="142" width="110" height="24" rx="5" fill="#e8eefc" stroke="#9ca3af" stroke-width="1.2" /><text x="95.0" y="159.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">…</text><rect x="40" y="168" width="110" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="95.0" y="185.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">?</text><rect x="40" y="194" width="110" height="24" rx="5" fill="#ffffff" stroke="#f59e0b" stroke-width="3" /><text x="95.0" y="211.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">F</text><text x="95" y="232" font-size="12" text-anchor="middle" font-weight="700" fill="#15803d">F อยู่ล่างสุด</text><circle cx="230" cy="62" r=