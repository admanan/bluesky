<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="450" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">Fitch–Cheney 5 ใบ: ผู้ช่วยวาง 4 ใบ  →  นักมายากลบอกใบที่ 5</text><text x="30" y="62" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">① คนดูเลือก 5 ใบ  →  ผู้ช่วยหา 'ไพ่ดอกเดียวกัน 2 ใบ' (♥ ♥)</text><rect x="40" y="76" width="54" height="76" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="3.5" /><text x="46" y="95" font-size="16" text-anchor="start" font-weight="700" fill="#c62828">K♥</text><text x="67.0" y="138" font-size="28" text-anchor="middle" font-weight="400" fill="#c62828">♥</text><rect x="110" y="76" width="54" height="76" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="3.5" /><text x="116" y="95" font-size="16" text-anchor="start" font-weight="700" fill="#c62828">3♥</text><text x="137.0" y="138" font-size="28" text-anchor="middle" font-weight="400" fill="#c62828">♥</text><rect x="180" y="76" width="54" height="76" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="186" y="95" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">9♠</text><text x="207.0" y="138" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><rect x="250" y="76" width="54" height="76" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="256" y="95" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">7♣</text><text x="277.0" y="138" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♣</text><rect x="320" y="76" width="54" height="76" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="326" y="95" font-size="16" text-anchor="start" font-weight="700" fill="#c62828">2♦</text><text x="347.0" y="138" font-size="28" text-anchor="middle" font-weight="400" fill="#c62828">♦</text><text x="30" y="184" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">② ระยะ K→A→2→3 = 3 (ไม่เกิน 6)  →  วาง K♥ เป็นใบแรก</text><text x="48" y="204" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">ใบที่ซ่อน = 3♥  และ d = 3</text><text x="30" y="230" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">③ ใบที่เหลือ 2♦ 7♣ 9♠ = เล็ก S / กลาง M / ใหญ่ L</text><text x="48" y="250" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">d = 3 ต้องวางเรียง M S L  (7♣, 2♦, 9♠)</text><rect x="40" y="266" width="54" height="76" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="3.5" /><text x="46" y="285" font-size="16" text-anchor="start" font-weight="700" fill="#c62828">K♥</text><text x="67.0" y="328" font-size="28" text-anchor="middle" font-weight="400" fill="#c62828">♥</text><text x="67" y="358" font-size="11" text-anchor="middle" font-weight="600" fill="#6b7280">ดอก+จุดเริ่ม</text><rect x="110" y="266" width="54" height="76" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="116" y="285" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">7♣</text><text x="137.0" y="328" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♣</text><text x="137" y="358" font-size="11" text-anchor="middle" font-weight="600" fill="#6b7280">M กลาง</text><rect x="180" y="266" width="54" height="76" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="186" y="285" font-size="16" text-anchor="start" font-weight="700" fill="#c62828">2♦</text><text x="207.0" y="328" font-size="28" text-anchor="middle" font-weight="400" fill="#c62828">♦</text><text x="207" y="358" font-size="11" text-anchor="middle" font-weight="600" fill="#6b7280">S เล็ก</text><rect x="250" y="266" width="54" height="76" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" /><text x="256" y="285" font-size="16" text-anchor="start" font-weight="700" fill="#1f2937">9♠</text><text x="277.0" y="328" font-size="28" text-anchor="middle" font-weight="400" fill="#1f2937">♠</text><text x="277" y="358" font-size="11" text-anchor="middle" font-weight="600" fill="#6b7280">L ใหญ่</text><text x="350" y="300" font-size="14" text-anchor="start" font-weight="700" fill="#1d4ed8">นักมายากลเห็น K♥ 7♣ 2♦ 9♠</text><text x="350" y="324" font-size="14" text-anchor="start" font-weight="700" fill="#15803d">ดอก = ♥  ·  M S L = 3  ·  K + 3 = 3  →  3♥</text><text x="540" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">ตารางรหัสระยะ d</text><rect x="540" y="72" width="190" height="20" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1" /><text x="552" y="87" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">d = 1</text><text x="718" y="87" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">S M L</text><rect x="540" y="94" width="190" height="20" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1" /><text x="552" y="109" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">d = 2</text><text x="718" y="109" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">S L M</text><rect x="540" y="116" width="190" height="20" rx="4" fill="#fff3cd" stroke="#f59e0b" stroke-width="1.5" /><text x="552" y="131" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">d = 3</text><text x="718" y="131" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">M S L</text><rect x="540" y="138" width="190" height="20" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1" /><text x="552" y="153" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">d = 4</text><text x="718" y="153" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">M L S</text><rect x="540" y="160" width="190" height="20" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1" /><text x="552" y="175" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">d = 5</text><text x="718" y="175" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">L S M</text><rect x="540" y="182" width="190" height="20" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1" /><text x="552" y="197" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">d = 6</text><text x="718" y="197" font-size="13" text-anchor="end" font-weight="600" fill="#1f2937">L M S</text><rect x="30" y="378" width="700" height="60" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2" /><text x="380" y="400" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">ลำดับขนาด: A&lt;2&lt;…&lt;K  ถ้าเลขเท่ากันเทียบดอก ♣ &lt; ♦ &lt; ♥ &lt; ♠</text><text x="380" y="422" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2937">ใบแรก = บอกดอกของใบซ่อน  ·  ใบซ่อน = ใบแรก + d (K→A วนรอบ)</text></svg>