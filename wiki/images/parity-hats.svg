<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="400" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">เดาสีไพ่บนหน้าผาก: คนแรกพูดเป็นรหัส ที่เหลือเดาถูกหมด</text><text x="30" y="62" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">ลำดับพูด: คนที่ 1 (เห็นทุกคน) → คนที่ 2 → … → คนที่ 6 (ไม่เห็นใคร)  ·  แดง = 1, ดำ = 0</text><rect x="30" y="80" width="100" height="56" rx="8" fill="#fecaca" stroke="#c62828" stroke-width="2" /><text x="80" y="104" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">คนที่ 1</text><text x="80" y="126" font-size="14" text-anchor="middle" font-weight="700" fill="#c62828">แดง</text><text x="80" y="156" font-size="13" text-anchor="middle" font-weight="700" fill="#f59e0b">พูด: ดำ</text><rect x="148" y="80" width="100" height="56" rx="8" fill="#d1d5db" stroke="#1f2937" stroke-width="2" /><text x="198" y="104" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">คนที่ 2</text><text x="198" y="126" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">ดำ</text><text x="198" y="156" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">พูด: ดำ</text><rect x="266" y="80" width="100" height="56" rx="8" fill="#d1d5db" stroke="#1f2937" stroke-width="2" /><text x="316" y="104" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">คนที่ 3</text><text x="316" y="126" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">ดำ</text><text x="316" y="156" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">พูด: ดำ</text><rect x="384" y="80" width="100" height="56" rx="8" fill="#fecaca" stroke="#c62828" stroke-width="2" /><text x="434" y="104" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">คนที่ 4</text><text x="434" y="126" font-size="14" text-anchor="middle" font-weight="700" fill="#c62828">แดง</text><text x="434" y="156" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">พูด: แดง</text><rect x="502" y="80" width="100" height="56" rx="8" fill="#d1d5db" stroke="#1f2937" stroke-width="2" /><text x="552" y="104" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">คนที่ 5</text><text x="552" y="126" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">ดำ</text><text x="552" y="156" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">พูด: ดำ</text><rect x="620" y="80" width="100" height="56" rx="8" fill="#fecaca" stroke="#c62828" stroke-width="2" /><text x="670" y="104" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">คนที่ 6</text><text x="670" y="126" font-size="14" text-anchor="middle" font-weight="700" fill="#c62828">แดง</text><text x="670" y="156" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">พูด: แดง</text><text x="30" y="190" font-size="13" text-anchor="start" font-weight="700" fill="#1d4ed8">คนที่ 1 พูด 'รหัส': ถ้าเห็นไพ่แดง (ของคนที่ 2–6) เป็นเลขคี่ → พูด 'แดง' · เป็นเลขคู่ → พูด 'ดำ'  (ตัวเองอาจผิด)</text><rect x="30" y="206" width="700" height="134" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="46" y="230" font-size="12" text-anchor="start" font-weight="600" fill="#1f2937">คนที่ 2: รหัส 'ดำ' = แดงของคนที่ 2–6 รวมกันเป็นเลขคู่  ·  เห็นแดงข้างหน้า 2 ใบ (คนที่ 4, 6)</text><text x="46" y="252" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">  → 2 (คู่) ครบแล้ว ตัวเองต้องไม่เพิ่มแดง → 'ดำ' ✓</text><text x="46" y="280" font-size="12" text-anchor="start" font-weight="600" fill="#1f2937">คนที่ 4: ได้ยินคนที่ 2, 3 พูด 'ดำ' (แดง 0)  ·  เห็นแดงข้างหน้า 1 ใบ (คนที่ 6)</text><text x="46" y="302" font-size="12" text-anchor="start" font-weight="400" fill="#1f2937">  → 0 + 1 = 1 (คี่) แต่ต้องรวมเป็นคู่ → ตัวเองต้อง 'แดง' ✓</text><text x="46" y="326" font-size="12" text-anchor="start" font-weight="700" fill="#15803d">ทุกคนใช้: รหัส − (แดงที่ได้ยินจากคนก่อนหน้า) − (แดงที่เห็นข้างหน้า)  → คู่ = ดำ, คี่ = แดง</text><rect x="30" y="350" width="700" height="38" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="374" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">คนที่ 2 ถึงคนสุดท้ายถูกต้อง 100% · คนที่ 1 ถูก 50% (ตรวจกับการสุ่ม 3,000 ชุดแล้ว)</text></svg>