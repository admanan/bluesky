<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="340" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">สูตรทั่วไป: n กอง k รอบ = ไพ่ nᵏ ใบ  →  ตำแหน่งปลายทางเป็นเลขฐาน n</text><text x="40" y="66" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">จำนวนไพ่</text><text x="190" y="66" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">กอง × รอบ</text><text x="340" y="66" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">ตำแหน่งปลายทาง t (จาก 0)</text><text x="580" y="66" font-size="13" text-anchor="start" font-weight="700" fill="#6b7280">ใบกลางพอดี = ช่อง</text><rect x="30" y="76" width="700" height="32" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="40" y="98" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">9</text><text x="190" y="98" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">3 × 2</text><text x="340" y="98" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">3·ช่องรอบ2 + ช่องรอบ1</text><text x="580" y="98" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">กลาง, กลาง → ใบที่ 5</text><rect x="30" y="114" width="700" height="32" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="40" y="136" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">16</text><text x="190" y="136" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">4 × 2</text><text x="340" y="136" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">4·ช่องรอบ2 + ช่องรอบ1</text><text x="580" y="136" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">(ไม่มีช่องกลางตรง)</text><rect x="30" y="152" width="700" height="32" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="40" y="174" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">25</text><text x="190" y="174" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">5 × 2</text><text x="340" y="174" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">5·ช่องรอบ2 + ช่องรอบ1</text><text x="580" y="174" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">กลาง, กลาง → ใบที่ 13</text><rect x="30" y="190" width="700" height="32" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="40" y="212" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">27</text><text x="190" y="212" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">3 × 3</text><text x="340" y="212" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">9·ช่องรอบ3 + 3·ช่อง2 + ช่อง1</text><text x="580" y="212" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">กลาง ×3 → ใบที่ 14</text><rect x="30" y="228" width="700" height="32" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="40" y="250" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">36</text><text x="190" y="250" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">6 × 2</text><text x="340" y="250" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">6·ช่องรอบ2 + ช่องรอบ1</text><text x="580" y="250" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">(ไม่มีช่องกลางตรง)</text><rect x="30" y="266" width="700" height="32" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="40" y="288" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">49</text><text x="190" y="288" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">7 × 2</text><text x="340" y="288" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">7·ช่องรอบ2 + ช่องรอบ1</text><text x="580" y="288" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">กลาง, กลาง → ใบที่ 25</text><rect x="30" y="304" width="700" height="30" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="323" font-size="12" text-anchor="middle" font-weight="700" fill="#15803d">ตรวจด้วยการจำลองจริง: (3,2) (4,2) (5,2) (3,3) — ทุกตำแหน่งเริ่ม × ทุกตำแหน่งปลายทาง</text></svg>