<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="360" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">เศษหาร 9: ทายเลขที่ผู้ชมปิดไว้ จากผลรวมเลขที่เหลือ</text><rect x="30" y="56" width="340" height="84" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" /><text x="200" y="82" font-size="12" text-anchor="middle" font-weight="700" fill="#1d4ed8">① ไพ่ 5 ใบ (A=1…9) เรียงเป็นเลข</text><text x="200" y="118" font-size="17" text-anchor="middle" font-weight="700" fill="#1f2937">5 3 8 2 1  →  53821</text><rect x="390" y="56" width="340" height="84" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" /><text x="560" y="82" font-size="12" text-anchor="middle" font-weight="700" fill="#1d4ed8">② สลับลำดับไพ่ใหม่</text><text x="560" y="118" font-size="17" text-anchor="middle" font-weight="700" fill="#1f2937">1 2 3 5 8  →  12358</text><rect x="30" y="152" width="340" height="84" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" /><text x="200" y="178" font-size="12" text-anchor="middle" font-weight="700" fill="#1d4ed8">③ ลบ (ใหญ่ − เล็ก)</text><text x="200" y="214" font-size="17" text-anchor="middle" font-weight="700" fill="#1f2937">53821 − 12358 = 41463</text><rect x="390" y="152" width="340" height="84" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" /><text x="560" y="178" font-size="12" text-anchor="middle" font-weight="700" fill="#1d4ed8">④ ผู้ชมปิดเลข 1 หลักที่ไม่ใช่ 0 (ตัวอย่าง: 6)</text><text x="560" y="214" font-size="17" text-anchor="middle" font-weight="700" fill="#1f2937">บอกที่เหลือ: 4 1 4 3</text><rect x="30" y="256" width="700" height="92" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="282" font-size="14" text-anchor="middle" font-weight="700" fill="#15803d">คุณบวกเลขที่เหลือ: 4 + 1 + 4 + 3 = 12  →  12 หาร 9 เหลือเศษ 3</text><text x="380" y="308" font-size="14" text-anchor="middle" font-weight="700" fill="#15803d">เลขที่ปิด = 9 − 3 = 6  (ถ้าเศษเป็น 0 เลขที่ปิดคือ 9)</text><text x="380" y="332" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">เหตุผล: เลขที่สลับหลักกัน มีผลรวมหลักเท่ากัน → ผลต่างหารด้วย 9 ลงตัวเสมอ</text></svg>