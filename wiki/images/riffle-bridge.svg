<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="330" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">Riffle Shuffle &amp; Bridge: สับแบบไพ่สลับ แล้วดัดสะพาน</text><circle cx="40" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="40" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="62" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">แบ่งครึ่ง</text><rect x="40" y="90" width="80" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="80.0" y="107.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">A</text><rect x="40" y="116" width="80" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="80.0" y="133.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">A</text><rect x="40" y="142" width="80" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="80.0" y="159.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">A</text><rect x="140" y="90" width="80" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="180.0" y="107.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">B</text><rect x="140" y="116" width="80" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="180.0" y="133.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">B</text><rect x="140" y="142" width="80" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="180.0" y="159.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">B</text><line x1="230" y1="118" x2="270" y2="118" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="285" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="285" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="307" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">ปล่อยสลับนิ้วโป้ง</text><rect x="290" y="90" width="90" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="335.0" y="107.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">A</text><rect x="290" y="116" width="90" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="335.0" y="133.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">B</text><rect x="290" y="142" width="90" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="335.0" y="159.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">A</text><rect x="290" y="168" width="90" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="335.0" y="185.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">B</text><rect x="290" y="194" width="90" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="335.0" y="211.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">B</text><rect x="290" y="220" width="90" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="335.0" y="237.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937">A</text><line x1="395" y1="118" x2="435" y2="118" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="450" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="450" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="472" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">ดัดสะพาน (Bridge)</text><path d="M455,170 Q515,90 575,170" fill="none" stroke="#2f4b8f" stroke-width="10" stroke-linecap="round"/><path d="M455,170 Q515,90 575,170" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="515" y="200" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">ใช้นิ้วโป้งงอ 2 ครึ่งขึ้น แล้วดันเข้าหากัน</text><text x="515" y="218" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">เสียงซ่าให้ไพ่ลงมาต่อกันเอง</text><rect x="30" y="256" width="700" height="56" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5" /><text x="380" y="280" font-size="13" text-anchor="middle" font-weight="700" fill="#15803d">ฝึกให้ 'ใบล่างสุด / บนสุด' อยู่ที่เดิมได้ เพื่อใช้ควบคุมไพ่ (ปล่อยใบแรกจากกองใดก็ได้ตามต้องการ)</text><text x="380" y="300" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">เริ่มจากสับช้า ๆ  ปล่อยทีละ 1–2 ใบ  แล้วค่อยเร่งความเร็ว</text></svg>