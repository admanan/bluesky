<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="320" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">ผลรวม 10 ตัวเลข: ผลรวมทั้งหมด = 11 × ตัวที่ 7</text><text x="30" y="62" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">ผู้ชมเลือกไพ่ 2 ใบเป็นเลขเริ่มต้น (3 และ 5) แล้วบวกต่อไปจนครบ 10 ตัว</text><rect x="30" y="84" width="62" height="56" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="61" y="108" font-size="17" text-anchor="middle" font-weight="700" fill="#1f2937">3</text><text x="61" y="130" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ตัวที่ 1</text><rect x="100" y="84" width="62" height="56" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="131" y="108" font-size="17" text-anchor="middle" font-weight="700" fill="#1f2937">5</text><text x="131" y="130" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ตัวที่ 2</text><rect x="170" y="84" width="62" height="56" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="201" y="108" font-size="17" text-anchor="middle" font-weight="700" fill="#1f2937">8</text><text x="201" y="130" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ตัวที่ 3</text><rect x="240" y="84" width="62" height="56" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="271" y="108" font-size="17" text-anchor="middle" font-weight="700" fill="#1f2937">13</text><text x="271" y="130" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ตัวที่ 4</text><rect x="310" y="84" width="62" height="56" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="341" y="108" font-size="17" text-anchor="middle" font-weight="700" fill="#1f2937">21</text><text x="341" y="130" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ตัวที่ 5</text><rect x="380" y="84" width="62" height="56" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="411" y="108" font-size="17" text-anchor="middle" font-weight="700" fill="#1f2937">34</text><text x="411" y="130" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ตัวที่ 6</text><rect x="450" y="84" width="62" height="56" rx="6" fill="#fff3cd" stroke="#f59e0b" stroke-width="3" /><text x="481" y="108" font-size="17" text-anchor="middle" font-weight="700" fill="#1f2937">55</text><text x="481" y="130" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ตัวที่ 7</text><rect x="520" y="84" width="62" height="56" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="551" y="108" font-size="17" text-anchor="middle" font-weight="700" fill="#1f2937">89</text><text x="551" y="130" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ตัวที่ 8</text><rect x="590" y="84" width="62" height="56" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="621" y="108" font-size="17" text-anchor="middle" font-weight="700" fill="#1f2937">144</text><text x="621" y="130" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ตัวที่ 9</text><rect x="660" y="84" width="62" height="56" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" /><text x="691" y="108" font-size="17" text-anchor="middle" font-weight="700" fill="#1f2937">233</text><text x="691" y="130" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">ตัวที่ 10</text><text x="30" y="172" font-size="15" text-anchor="start" font-weight="700" fill="#15803d">คุณมองแค่ตัวที่ 7 (55) แล้วคูณ 11 → 605  ·  ผู้ชมบวกทั้ง 10 ตัวได้ 605 เท่ากัน</text><rect x="30" y="196" width="700" height="100" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2" /><text x="380" y="224" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">ไม่อยากรอเห็นตัวที่ 7? คำนวณได้จากสองตัวแรก: ตัวที่ 7 = 5·a + 8·b  (5·3 + 8·5 = 55)</text><text x="380" y="250" font-size="14" text-anchor="middle" font-weight="700" fill="#1d4ed8">ผลรวมทั้งหมด = 11 × (5a + 8b) = 55a + 88b</text><text x="380" y="276" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">ตรวจครบทุก a, b ตั้งแต่ 1 ถึง 10 แล้ว</text></svg>