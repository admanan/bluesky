<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Sarabun','Noto Sans Thai','Tahoma',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="760" height="330" rx="14" fill="#faf8f3" stroke="#e5e0d3"/><text x="380.0" y="30" font-size="20" text-anchor="middle" font-weight="700" fill="#1f2937">Classic Pass: สลับครึ่งบน–ล่างในพริบตา → ไพ่ที่เลือกขึ้นมาอยู่บนสุด</text><circle cx="40" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="40" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="62" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">มี 'รอยแยก' ด้วยนิ้วก้อย</text><rect x="40" y="92" width="110" height="36" rx="6" fill="#e8eefc" stroke="#6b7280" stroke-width="1.5" /><text x="95" y="115" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">ครึ่งบน U</text><line x1="36" y1="134" x2="154" y2="134" stroke="#c62828" stroke-width="3" stroke-dasharray="6 4"/><text x="95" y="150" font-size="11" text-anchor="middle" font-weight="700" fill="#c62828">รอยแยก (นิ้วก้อย)</text><rect x="40" y="158" width="110" height="30" rx="6" fill="#fff3cd" stroke="#f59e0b" stroke-width="2.5" /><text x="95" y="178" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">ไพ่ที่เลือก</text><rect x="40" y="188" width="110" height="36" rx="6" fill="#e8eefc" stroke="#6b7280" stroke-width="1.5" /><text x="95" y="211" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">ครึ่งล่าง L</text><line x1="170" y1="150" x2="235" y2="150" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="255" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="255" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="277" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">มือขวาปิดบัง สลับครึ่ง</text><rect x="255" y="92" width="100" height="36" rx="6" fill="#e8eefc" stroke="#6b7280" stroke-width="1.5" /><text x="305" y="115" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">U</text><rect x="385" y="150" width="100" height="60" rx="6" fill="#fff3cd" stroke="#f59e0b" stroke-width="2.5" /><text x="435" y="185" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">L + ไพ่ที่เลือก</text><path d="M360,112 C410,112 400,140 385,160" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/><path d="M385,200 C320,215 270,190 290,138" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)" stroke-dasharray="5 4"/><text x="370" y="240" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280">L ถูกยกขึ้นไปบนสุด  ·  U ลงไปล่าง</text><line x1="505" y1="150" x2="565" y2="150" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><circle cx="590" cy="62" r="13" fill="#1d4ed8" stroke="none"/><text x="590" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="612" y="67" font-size="13" text-anchor="start" font-weight="600" fill="#1f2937">ผลลัพธ์</text><rect x="590" y="92" width="110" height="30" rx="6" fill="#fff3cd" stroke="#f59e0b" stroke-width="2.5" /><text x="645" y="112" font-size="11" text-anchor="middle" font-weight="700" fill="#1f2937">ไพ่ที่เลือก (บนสุด)</text><rect x="590" y="122" width="110" height="36" rx="6" fill="#e8eefc" stroke="#6b7280" stroke-width="1.5" /><text x="645" y="145" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">ครึ่งล่าง L</text><rect x="590" y="158" width="110" height="36" rx="6" fill="#e8eefc" stroke="#6b7280" stroke-width="1.5" /><text x="645" y="181" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">ครึ่งบน U</text><rect x="30" y="262" width="700" height="54" rx="10" fill="#fef2f2" stroke="#c62828" stroke-width="1.5" /><text x="380" y="284" font-size="13" text-anchor="middle" font-weight="700" fill="#c62828">ทำตอน 'มีจังหวะบังสายตา' เช่น คนดูกำลังมองหน้าคุณ หรือคุณพลิกมือเปลี่ยนเรื่อง</text><text x="380" y="304" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">ฝึกกับสำรับเก่าช้า ๆ ก่อนค่อยเร็ว · ต้องเงียบที่สุด</text></svg>