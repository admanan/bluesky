<title>เจ้าสัวเชียงใหม่</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
  /* Layout: a classic business-sim frame — beveled steel toolbar on top, isometric city in the middle,
     vertical tool dock on the right, status line at the bottom, floating windows over the city.
     Deliberately a single dark "game chrome" look in every theme. */
  :root {
    color-scheme: dark;
    --desk:#11161c; --panel:#2f3a47; --panel-2:#26303b; --hi:#5b6b7e; --lo:#0e1318; --inset:#161d25;
    --title-a:#41618a; --title-b:#22354d; --text:#e9eef3; --text-2:#aab6c3; --muted:#7f8c99;
    --gold:#e8b64c; --lcd:#9fe0a8; --you:#3fbf7f; --cheap:#e6a52e; --premium:#b97bd8; --port:#5aa0d8;
    --good:#62d595; --bad:#ff7d6e; --line:#3c4856;
    --g-core:#a9a597; --g-sub:#93ab78; --g-rural:#6f9a4f; --g-road:#55585c; --g-water:#3f80b2; --g-mark:#d8d3a0;
    --display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
    --body:"IBM Plex Sans Thai",system-ui,sans-serif;
    --mono:"IBM Plex Mono","IBM Plex Sans Thai",ui-monospace,monospace;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { background:var(--desk); color:var(--text); font:13px/1.45 var(--body); overflow:hidden; }
  button, select, input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
  .num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .pos { color:var(--good); } .neg { color:var(--bad); } .muted { color:var(--muted); }

  /* bevels */
  .bevel { background:var(--panel); border:1px solid; border-color:var(--hi) var(--lo) var(--lo) var(--hi); }
  .inset { background:var(--inset); border:1px solid; border-color:var(--lo) var(--hi) var(--hi) var(--lo); }
  .bt { background:linear-gradient(#3c4a5a,#2c3744); border:1px solid; border-color:var(--hi) var(--lo) var(--lo) var(--hi); border-radius:2px; padding:5px 10px; color:var(--text); }
  .bt:hover:not(:disabled) { background:linear-gradient(#46566a,#323e4c); }
  .bt:active:not(:disabled), .bt[aria-pressed="true"] { border-color:var(--lo) var(--hi) var(--hi) var(--lo); background:#1e2730; color:var(--gold); }
  .bt:disabled { opacity:.45; cursor:not-allowed; }
  .bt.go { color:var(--gold); font-weight:600; }
  .bt.danger { color:var(--bad); }

  .game { height:100%; display:flex; flex-direction:column; gap:6px; padding-block:6px;
    padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }

  /* top toolbar */
  .bar { display:flex; flex-wrap:wrap; align-items:stretch; gap:6px; padding:5px; }
  .brand { display:flex; flex-direction:column; justify-content:center; padding:0 10px 0 6px; border-right:1px solid var(--lo); box-shadow:1px 0 0 var(--hi); }
  .brand b { font:700 1.15rem/1 var(--display); color:var(--gold); letter-spacing:.02em; text-shadow:0 1px 0 #000; }
  .brand small { font-size:.66rem; color:var(--muted); letter-spacing:.08em; margin-top:2px; }
  .lcd { display:flex; flex-direction:column; justify-content:center; padding:3px 10px; min-width:0; }
  .lcd span { font-size:.64rem; color:var(--muted); letter-spacing:.06em; }
  .lcd b { font:600 .95rem var(--mono); color:var(--lcd); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .lcd b.neg { color:var(--bad); }
  .goal i { display:block; height:4px; background:#0a0e12; margin-top:3px; }
  .goal i i { height:100%; width:0; background:var(--gold); }
  .speed { display:flex; gap:2px; margin-left:auto; align-items:center; }
  .speed .bt { min-width:40px; font:600 .8rem var(--mono); padding:6px 8px; }

  /* stage */
  .stage { position:relative; flex:1; min-height:0; display:flex; gap:6px; }
  .view { position:relative; flex:1; min-width:0; overflow:hidden; }
  .vp { position:absolute; inset:3px; overflow:auto; background:#1d2a1c; scrollbar-width:thin; scrollbar-color:var(--hi) var(--inset); }
  #map { display:block; touch-action:none; cursor:grab; }
  #map.building { cursor:crosshair; }
  .zoom { position:absolute; left:10px; bottom:10px; display:flex; flex-direction:column; gap:2px; z-index:2; }
  .zoom .bt { width:30px; height:30px; padding:0; font:700 1rem var(--mono); }
  .dock { display:flex; flex-direction:column; gap:4px; padding:5px; width:76px; overflow-y:auto; }
  .dock .bt { display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 2px 5px; font-size:.68rem; line-height:1.15; text-align:center; }
  .dock .bt svg { width:24px; height:24px; }
  .dock hr { border:0; border-top:1px solid var(--lo); border-bottom:1px solid var(--hi); margin:3px 0; width:100%; }
  .status { padding:4px 10px; font-size:.78rem; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:26px; }
  .status b { color:var(--gold); font-weight:600; }
  svg.ic { fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* floating window */
  .win { position:absolute; top:8px; right:8px; bottom:8px; width:min(780px, calc(100% - 16px)); display:flex; flex-direction:column; z-index:4; box-shadow:0 10px 30px rgb(0 0 0 / .55); }
  .win.narrow { width:min(560px, calc(100% - 16px)); }
  .win-t { display:flex; align-items:center; gap:8px; padding:4px 4px 4px 10px; background:linear-gradient(var(--title-a),var(--title-b)); border-bottom:1px solid var(--lo); }
  .win-t h2 { flex:1; margin:0; font:600 .95rem var(--display); letter-spacing:.02em; text-shadow:0 1px 0 #000; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .win-t .bt { padding:1px 8px; font-weight:700; }
  .win-b { flex:1; overflow:auto; padding:12px; min-height:0; }
  h3 { font:600 .86rem var(--display); color:var(--gold); margin:0 0 6px; letter-spacing:.03em; text-wrap:balance; }
  .sec + .sec { margin-top:14px; }

  /* firm screen */
  .firm { display:grid; grid-template-columns:minmax(0,320px) minmax(0,1fr); gap:14px; }
  .facts { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; margin-bottom:10px; }
  .facts div { padding:4px 7px; min-width:0; }
  .facts span { display:block; font-size:.64rem; color:var(--muted); }
  .facts b { font:600 .82rem var(--mono); white-space:nowrap; }
  .board { position:relative; padding:8px; }
  .g9 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .links { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .u { position:relative; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:5px 3px 4px; min-width:0; text-align:center; }
  .u .ut { font:600 .66rem var(--display); letter-spacing:.04em; color:var(--text-2); }
  .u svg.ic { width:32%; height:auto; }
  .u .up { font-size:.66rem; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:3px; }
  .pips { display:flex; gap:1px; }
  .pips i { width:5px; height:5px; background:#0a0e12; }
  .pips i.on { background:var(--gold); }
  .u.empty { color:var(--muted); justify-content:center; font-size:1.3rem; }
  .u.sel { outline:2px solid var(--gold); outline-offset:-2px; }
  .u.warn::after { content:"!"; position:absolute; top:3px; right:4px; width:14px; height:14px; border-radius:50%; background:var(--bad); color:#fff; font:700 .66rem/14px var(--mono); }
  .u[data-u="purchase"] svg { color:var(--port); } .u[data-u="sales"] svg { color:var(--gold); } .u[data-u="make"] svg { color:#d7dde3; }
  .u[data-u="grow"] svg { color:var(--good); } .u[data-u="ad"] svg { color:#f08a5d; } .u[data-u="research"] svg { color:var(--premium); }
  .chip { display:inline-block; width:9px; height:9px; border:1px solid #0008; flex:none; }
  .detail { min-width:0; }
  .dh { display:flex; align-items:center; gap:10px; padding:8px; margin-bottom:10px; }
  .dh svg.ic { width:34px; height:34px; color:var(--gold); }
  .dh b { font:600 1rem var(--display); display:block; }
  .field { display:grid; gap:3px; margin-bottom:8px; }
  .field label { font-size:.7rem; color:var(--muted); letter-spacing:.04em; }
  select, input[type=number] { width:100%; padding:5px 7px; background:var(--inset); border:1px solid; border-color:var(--lo) var(--hi) var(--hi) var(--lo); border-radius:0; }
  .meter { display:grid; grid-template-columns:96px minmax(0,1fr) 38px; align-items:center; gap:8px; font-size:.76rem; margin-bottom:4px; }
  .meter .tr { height:10px; background:#0a0e12; border:1px solid var(--lo); position:relative; }
  .meter .tr i { position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,#c8902f,var(--gold)); }
  .meter .tr em { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--bad); }
  .meter b { font-family:var(--mono); text-align:right; }
  .msg { padding:6px 8px; font-size:.78rem; color:var(--text-2); margin-bottom:8px; }
  .msg.bad { color:var(--bad); }
  .row { display:flex; flex-wrap:wrap; gap:4px; }
  table { width:100%; border-collapse:collapse; font-size:.78rem; }
  th, td { padding:4px 6px; text-align:right; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { font-weight:600; color:var(--muted); font-size:.68rem; letter-spacing:.04em; background:var(--panel-2); }
  tbody tr:nth-child(even) td { background:#ffffff06; }
  td.num { font-family:var(--mono); }
  .tw { overflow-x:auto; }
  .cols { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; }
  canvas.chart { display:block; width:100%; height:220px; }
  #news { list-style:none; margin:0; padding:0; display:grid; gap:5px; }
  #news li { display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; font-size:.8rem; }
  #news time { font:.68rem var(--mono); color:var(--muted); padding-top:2px; white-space:nowrap; }
  #news li.good span { color:var(--good); } #news li.bad span { color:var(--bad); }
  .dotc { display:inline-block; width:9px; height:9px; margin-right:6px; vertical-align:0; border:1px solid #0008; }
  .help p, .help li { color:var(--text-2); max-width:65ch; }
  .help ul { padding-left:18px; margin:4px 0 10px; }

  .toast { position:fixed; left:50%; bottom:calc(40px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,16px); opacity:0; pointer-events:none; z-index:20;
    padding:7px 14px; font-size:.84rem; max-width:calc(100% - 32px); transition:opacity .25s, transform .25s; color:var(--gold); }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  .overlay { position:fixed; inset:0; background:rgb(0 0 0 / .55); display:grid; place-items:center; z-index:30; padding:16px; }
  .modal { max-width:440px; width:100%; }
  .modal .win-b p { color:var(--text-2); margin:0 0 12px; }

  @media (max-width:760px) {
    .bar { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
    .brand { grid-column:1 / -1; border:0; box-shadow:none; flex-direction:row; align-items:baseline; gap:8px; }
    .speed { grid-column:1 / -1; margin:0; justify-content:stretch; } .speed .bt { flex:1; }
    .stage { flex-direction:column; }
    .dock { flex-direction:row; width:auto; overflow-x:auto; overflow-y:hidden; flex:none; }
    .dock .bt { min-width:62px; } .dock hr { display:none; }
    .win, .win.narrow { inset:0; width:auto; }
    .firm, .cols { grid-template-columns:minmax(0,1fr); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

<div class="game">
  <header class="bar bevel">
    <div class="brand"><b>เจ้าสัวเชียงใหม่</b><small>BUSINESS SIM · CHIANG MAI</small></div>
    <div class="lcd inset"><span>วันที่</span><b id="s-date"></b></div>
    <div class="lcd inset"><span>เงินสด</span><b id="s-cash"></b></div>
    <div class="lcd inset"><span>กำไรเดือนนี้</span><b id="s-mtd"></b></div>
    <div class="lcd inset goal"><span id="s-goal-l">มูลค่าบริษัท</span><b id="s-nw"></b><i><i id="s-goalbar"></i></i></div>
    <div class="speed" role="group" aria-label="ความเร็วเวลา">
      <button class="bt" data-speed="0" aria-label="หยุด">❚❚</button>
      <button class="bt" data-speed="1" aria-label="ความเร็ว 1 เท่า">▶</button>
      <button class="bt" data-speed="2" aria-label="ความเร็ว 2 เท่า">▶▶</button>
      <button class="bt" data-speed="3" aria-label="ความเร็ว 4 เท่า">▶▶▶</button>
    </div>
  </header>

  <div class="stage">
    <div class="view bevel">
      <div class="vp inset" id="vp"><canvas id="map" aria-label="แผนที่เมืองเชียงใหม่แบบ isometric"></canvas></div>
      <div class="zoom"><button class="bt" id="zin" aria-label="ซูมเข้า">+</button><button class="bt" id="zout" aria-label="ซูมออก">−</button></div>
      <section class="win bevel" id="win" hidden aria-labelledby="win-title">
        <div class="win-t"><h2 id="win-title"></h2><button class="bt" id="win-x" aria-label="ปิดหน้าต่าง">✕</button></div>
        <div class="win-b" id="win-b"></div>
      </section>
    </div>
    <nav class="dock bevel" id="dock" aria-label="เครื่องมือ"></nav>
  </div>

  <footer class="status inset" id="status" aria-live="off"></footer>
</div>

<div class="toast bevel" id="toast" role="status" aria-live="polite"></div>
<div class="overlay" id="overlay" hidden>
  <div class="modal bevel" role="dialog" aria-modal="true" aria-labelledby="ov-t">
    <div class="win-t"><h2 id="ov-t"></h2></div>
    <div class="win-b"><p id="ov-b"></p><div class="row"><button class="bt go" id="ov-new">เล่นใหม่</button><button class="bt" id="ov-close">ดูผลงาน</button></div></div>
  </div>
</div>

<script>
/*SIM-START*/
// ---- Simulation: pure game logic, no DOM. A three.js city could render the same `state` later. ----
const Sim = (() => {
  const W = 30, H = 20, DAY = 864e5;
  const CFG = { startCash:5e6, goal:25e6, days:1096, startYear:2027, loanLimit:10e6, interest:.006, salvage:.7, sellBack:.5,
    unitSetup:20000, upgrade:15000, maxLevel:9, K:2, exp:2, landPerTile:60000 };
  const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

  // port = import price, q = import quality; consumer goods have a daily city demand at a reference price
  const P = {
    beans:   { name:'เมล็ดกาแฟ',  kind:'raw', port:5,   q:40 },
    tealeaf: { name:'ใบชา',       kind:'raw', port:2.5, q:40 },
    milk:    { name:'นมสด',       kind:'raw', port:3,   q:40 },
    sugar:   { name:'น้ำตาลอ้อย', kind:'raw', port:1.2, q:45 },
    wheat:   { name:'ข้าวสาลี',   kind:'raw', port:1.5, q:40 },
    coffee:  { name:'กาแฟกระป๋อง', kind:'consumer', port:19, q:35, ref:25, demand:6000, recipe:{ beans:1, milk:1, sugar:1 }, w:[.35,.3,.35], drink:true },
    thaitea: { name:'ชาไทยขวด',   kind:'consumer', port:15, q:35, ref:20, demand:5000, recipe:{ tealeaf:1, milk:1, sugar:1 }, w:[.3,.3,.4], drink:true },
    bread:   { name:'ขนมปังแผ่น', kind:'consumer', port:23, q:35, ref:30, demand:4000, recipe:{ wheat:2, milk:1, sugar:1 }, w:[.4,.2,.4] },
  };
  const RAW = Object.keys(P).filter(k => P[k].kind === 'raw');
  const CONSUMER = Object.keys(P).filter(k => P[k].kind === 'consumer');

  const FIRMS = {
    store:   { name:'ร้านค้าปลีก', glyph:'ร', cost:150000, maint:300, units:['purchase','sales','ad'], maxV:1 },
    factory: { name:'โรงงาน',     glyph:'ง', cost:400000, maint:600, units:['purchase','make'],    maxV:.6 },
    farm:    { name:'ฟาร์ม',      glyph:'ฟ', cost:250000, maint:300, units:['grow'],               maxV:.35 },
    lab:     { name:'ศูนย์วิจัย',  glyph:'ว', cost:300000, maint:500, units:['research'],           maxV:1 },
  };
  const UNITS = {
    purchase: { name:'จัดซื้อ',  cap:200, products:() => [...RAW, ...CONSUMER] },
    sales:    { name:'ขายปลีก',  cap:150, products:() => CONSUMER },
    make:     { name:'ผลิต',     cap:200, products:() => CONSUMER },
    grow:     { name:'เพาะปลูก', cap:150, products:() => RAW },
    ad:       { name:'โฆษณา',    products:() => CONSUMER },
    research: { name:'วิจัย',     products:() => CONSUMER },
  };
  const unitCap = u => (UNITS[u.type].cap || 0) * u.level;
  const unitDaily = u => u.type === 'ad' ? 400 * u.level : u.type === 'research' ? 800 * u.level : 200 + 50 * u.level;

  // ---- map ----
  const CENTER = { x:12.5, y:7.5 };
  function tile(x, y) {
    const road = x % 5 === 0 || y % 5 === 0;
    const river = x === 22 && !road;
    const d = Math.hypot(x + .5 - CENTER.x, (y + .5 - CENTER.y) * 1.15);
    const v = Math.max(.1, Math.min(1, 1 - d / 15));
    return { road, river, v, zone: v >= .6 ? 'core' : v >= .35 ? 'sub' : 'rural' };
  }
  const TILES = Array.from({ length: H }, (_, y) => Array.from({ length: W }, (_, x) => tile(x, y)));
  const footprint = (x, y) => [[x, y], [x + 1, y], [x, y + 1], [x + 1, y + 1]];
  const firmValue = f => footprint(f.x, f.y).reduce((a, [x, y]) => a + TILES[y][x].v, 0) / 4;
  function canBuild(state, type, x, y) {
    if (x < 0 || y < 0 || x + 1 >= W || y + 1 >= H) return 'นอกแผนที่';
    for (const [a, b] of footprint(x, y)) {
      const t = TILES[b][a];
      if (t.road) return 'ติดถนน';
      if (t.river) return 'ติดแม่น้ำปิง';
      if (state.firms.some(f => a >= f.x && a <= f.x + 1 && b >= f.y && b <= f.y + 1)) return 'มีอาคารอยู่แล้ว';
    }
    const v = firmValue({ x, y });
    if (v > FIRMS[type].maxV + 1e-9) return type === 'farm' ? 'ฟาร์มต้องอยู่ในเขตชนบท' : 'โรงงานต้องอยู่นอกใจกลางเมือง';
    return null;
  }
  const landCost = (x, y) => Math.round(firmValue({ x, y }) * 4 * CFG.landPerTile / 1000) * 1000;
  const buildCost = (type, x, y) => FIRMS[type].cost + landCost(x, y);
  const firmAt = (state, x, y) => state.firms.find(f => x >= f.x && x <= f.x + 1 && y >= f.y && y <= f.y + 1);

  // ---- helpers ----
  const dateOf = day => new Date(Date.UTC(CFG.startYear, 0, 1) + day * DAY);
  const dateLabel = day => { const d = dateOf(day); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear() + 543}`; };
  const monthLabel = day => { const d = dateOf(day); return `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear() + 543}`; };
  const comp = (state, id) => state.companies.find(c => c.id === id);
  const mod = (state, kind, key) => state.mods.filter(m => m.kind === kind && (m.key === key || m.key === 'all')).reduce((a, m) => a * m.mult, 1);
  const portPrice = (state, p, c) => P[p].port * mod(state, 'port', p) * (c && c.importMult || 1);
  const portQ = (p, c) => c && c.importQ ? Math.max(c.importQ, P[p].q) : P[p].q;
  const priceScore = (p, price) => Math.min(100, 50 * Math.pow(P[p].ref / Math.max(.01, price), 2));
  function rating(state, firm, unit, p) {
    const c = comp(state, firm.owner), inv = firm.inv[p];
    const [wq, wb, wp] = P[p].w;
    return wq * (inv ? inv.q : 0) + wb * c.brand[p] + wp * priceScore(p, unit.price);
  }
  function season(p, day) {
    const m = dateOf(day).getUTCMonth();
    let k = 1;
    if (P[p].drink) k *= [1,1,1.2,1.25,1.2,.9,.9,.9,.9,1,1,1][m]; // hot season Mar–May, rains Jun–Sep
    if (m === 10 || m === 11) k *= 1.1;                          // Yi Peng & high season tourists
    return k;
  }
  const demand = (state, p) => P[p].demand * season(p, state.day) * mod(state, 'demand', p) * state.pop;

  function addInv(firm, p, qty, q) {
    if (qty <= 0) return;
    const i = firm.inv[p] || (firm.inv[p] = { qty:0, q:0 });
    i.q = (i.q * i.qty + q * qty) / (i.qty + qty); i.qty += qty;
  }
  function takeInv(firm, p, qty) {
    const i = firm.inv[p]; if (!i) return 0;
    const t = Math.min(i.qty, qty); i.qty -= t; return t;
  }
  const units = f => f.units.filter(Boolean);
  const outputOf = f => units(f).filter(u => u.type === 'grow' || u.type === 'make').map(u => u.product).filter(Boolean);
  // own firms that produce p (farms growing it, factories making it)
  const sourcesFor = (state, owner, p) => state.firms.filter(f => f.owner === owner && outputOf(f).includes(p));

  function book(state, c, cat, amt) {
    c.cash += cat === 'sales' ? amt : -amt;
    c.mtd[cat] = (c.mtd[cat] || 0) + amt;
  }
  const newMtd = () => ({ sales:0, imports:0, staff:0, ads:0, rnd:0, interest:0, capex:0 });

  function netWorth(state, c) {
    let v = c.cash - c.loan;
    for (const f of state.firms) if (f.owner === c.id) {
      v += f.invested * CFG.salvage;
      for (const p in f.inv) v += f.inv[p].qty * P[p].port * .5;
    }
    return v;
  }

  // ---- building & units ----
  function placeFirm(state, owner, type, x, y, spec = []) {
    const c = comp(state, owner), cost = buildCost(type, x, y);
    const f = { id: state.nextId++, owner, type, x, y, units: Array(9).fill(null), inv:{}, invested: cost, mtd:{ rev:0, cost:0 }, last:null };
    state.firms.push(f);
    book(state, c, 'capex', cost);
    spec.forEach((u, i) => setUnit(state, f, i, u));
    return f;
  }
  function setUnit(state, f, slot, u) {
    const c = comp(state, f.owner);
    f.units[slot] = { type:u.type, product:u.product || null, src:u.src || 'port', price:u.price || (u.product && P[u.product].ref) || 0, level:u.level || 1, last:0, warn:'' };
    const cost = CFG.unitSetup + (f.units[slot].level - 1) * CFG.upgrade;
    f.invested += cost; book(state, c, 'capex', cost);
  }

  // ---- one day ----
  function day(state, rng) {
    const cs = state.companies;
    for (const c of cs) for (const p of CONSUMER) c.brand[p] *= .998;
    for (const f of state.firms) {
      if (f.type === 'port') continue;
      const c = comp(state, f.owner);
      const fixed = FIRMS[f.type].maint;
      book(state, c, 'staff', fixed); f.mtd.cost += fixed;
      for (const u of units(f)) {
        const k = unitDaily(u);
        book(state, c, u.type === 'ad' ? 'ads' : u.type === 'research' ? 'rnd' : 'staff', k); f.mtd.cost += k;
        u.last = 0; u.warn = u.product ? '' : 'ยังไม่ได้เลือกสินค้า';
      }
    }
    const byType = t => state.firms.filter(f => f.type === t);
    // farms
    for (const f of byType('farm')) for (const u of units(f)) if (u.type === 'grow' && u.product) {
      const room = 3000 * u.level - (f.inv[u.product]?.qty || 0);
      const q = Math.min(unitCap(u), Math.max(0, room));
      addInv(f, u.product, q, 30 + 5 * u.level); u.last = q;
      if (!q) u.warn = 'คลังเต็ม ตั้งให้โรงงานซื้อวัตถุดิบจากฟาร์มนี้';
    }
    const purchase = f => {
      const c = comp(state, f.owner);
      for (const u of units(f)) if (u.type === 'purchase' && u.product) {
        const p = u.product, have = f.inv[p]?.qty || 0;
        const want = Math.min(unitCap(u), Math.max(0, 3 * unitCap(u) - have));
        if (!want) continue;
        if (u.src === 'port') {
          const price = portPrice(state, p, c);
          if (c.cash < price * want && c.id === 'you' && c.cash < 0) { u.warn = 'เงินสดติดลบ ซื้อของไม่ได้'; continue; }
          addInv(f, p, want, portQ(p, c)); book(state, c, 'imports', price * want); f.mtd.cost += price * want; u.last = want;
        } else {
          const s = state.firms.find(x => x.id === u.src);
          if (!s) { u.warn = 'แหล่งสินค้าถูกขายไปแล้ว'; continue; }
          const q0 = s.inv[p]?.q || 0, got = takeInv(s, p, want);
          addInv(f, p, got, q0); u.last = got;
          if (!got) u.warn = `${FIRMS[s.type].name} #${s.id} ยังไม่มี${P[p].name}`;
        }
      }
    };
    // factories: buy inputs, then make
    for (const f of byType('factory')) {
      purchase(f);
      const c = comp(state, f.owner);
      for (const u of units(f)) if (u.type === 'make' && u.product) {
        const r = P[u.product].recipe, out = u.product;
        if ((f.inv[out]?.qty || 0) > 3000 * u.level) { u.warn = 'คลังสินค้าเต็ม ยังไม่มีร้านมารับ ตั้งให้ร้านค้าปลีกซื้อจากโรงงานนี้'; continue; }
        let n = unitCap(u);
        for (const i in r) n = Math.min(n, Math.floor((f.inv[i]?.qty || 0) / r[i]));
        if (n <= 0) { u.warn = 'วัตถุดิบไม่พอ: ' + Object.keys(r).filter(i => (f.inv[i]?.qty || 0) < r[i]).map(i => P[i].name).join(', '); continue; }
        let qs = 0, ws = 0;
        for (const i in r) { qs += f.inv[i].q * r[i]; ws += r[i]; takeInv(f, i, n * r[i]); }
        addInv(f, out, n, .5 * qs / ws + .5 * c.tech[out]); u.last = n;
      }
    }
    for (const f of byType('store')) purchase(f);
    // labs & advertising
    for (const f of state.firms) {
      if (f.type === 'port') continue;
      const c = comp(state, f.owner);
      for (const u of units(f)) {
        if (u.type === 'research' && u.product) { c.tech[u.product] += .04 * u.level * (1 - c.tech[u.product] / 100); u.last = 1; }
        if (u.type === 'ad' && u.product) { c.brand[u.product] += .03 * u.level * (1 - c.brand[u.product] / 100); u.last = 1; }
      }
    }
    // retail market: every sales unit competes for the city's daily demand of its product
    for (const p of CONSUMER) {
      const sellers = [];
      for (const f of byType('store')) for (const u of units(f)) if (u.type === 'sales' && u.product === p) {
        if (!(f.inv[p]?.qty > 0)) { u.warn = `ไม่มี${P[p].name}ในร้าน ต้องมีหน่วยจัดซื้อ`; continue; }
        const r = rating(state, f, u, p);
        sellers.push({ f, u, A: Math.pow(r / 50, CFG.exp) * (.4 + .8 * firmValue(f)) * Math.sqrt(u.level) });
      }
      const D = demand(state, p), tot = sellers.reduce((a, s) => a + s.A, 0) + CFG.K;
      state.market[p].demand += D;
      for (const s of sellers) {
        const q = Math.floor(Math.min(D * s.A / tot, unitCap(s.u), s.f.inv[p].qty));
        takeInv(s.f, p, q); s.u.last = q;
        const c = comp(state, s.f.owner);
        book(state, c, 'sales', q * s.u.price); s.f.mtd.rev += q * s.u.price;
        c.sold[p] = (c.sold[p] || 0) + q; state.market[p].sold += q;
        if (q >= unitCap(s.u) && s.f.owner === 'you') s.u.warn = 'ขายเต็มกำลัง ลองอัปเกรดหน่วยนี้';
      }
    }
    state.pop *= 1.0003;
    state.day++;
    if (dateOf(state.day).getUTCDate() === 1) monthEnd(state, rng);
  }

  // ---- month end: interest, reports, AI, events ----
  function monthEnd(state, rng) {
    for (const c of state.companies) {
      if (c.loan) book(state, c, 'interest', Math.round(c.loan * CFG.interest));
      const m = c.mtd;
      m.net = m.sales - m.imports - m.staff - m.ads - m.rnd - m.interest;
      c.last = m; c.mtd = newMtd();
      c.soldLast = c.sold; c.sold = {};
    }
    state.marketLast = state.market; state.market = freshMarket();
    for (const f of state.firms) { f.last = f.mtd; f.mtd = { rev:0, cost:0 }; }
    const you = comp(state, 'you');
    news(state, `ปิดงบ ${monthLabel(state.day - 1)}: ${you.last.net >= 0 ? 'กำไร' : 'ขาดทุน'} ฿${Math.abs(Math.round(you.last.net)).toLocaleString('th-TH')}`, you.last.net >= 0 ? 'good' : 'bad');
    if (you.cash < 0) {
      const need = Math.ceil(-you.cash / 100000) * 100000;
      if (you.loan + need <= CFG.loanLimit) { you.loan += need; you.cash += need; news(state, `เงินสดติดลบ ธนาคารปล่อยกู้ฉุกเฉิน ฿${need.toLocaleString('th-TH')}`, 'bad'); }
      else state.over = { kind:'bankrupt' };
    }
    ai(state, rng);
    state.mods = state.mods.map(m => ({ ...m, left: m.left - 1 })).filter(m => m.left > 0);
    events(state, rng);
    state.history.push({ day: state.day, nw: state.companies.map(c => Math.round(netWorth(state, c))), cash: Math.round(you.cash), net: Math.round(you.last.net) });
    if (!state.over && netWorth(state, you) >= CFG.goal) state.over = { kind:'win' };
    else if (!state.over && state.day >= CFG.days) state.over = { kind:'timeup' };
  }

  const EVENTS = [
    { w:3, tone:'bad', make: (s, r) => { const p = RAW[Math.floor(r() * RAW.length)]; s.mods.push({ kind:'port', key:p, mult:1.35, left:2 }); return `ราคา${P[p].name}นำเข้าพุ่ง 35% อีก 2 เดือน`; } },
    { w:2, tone:'bad', make: s => { s.mods.push({ kind:'port', key:'milk', mult:1.4, left:2 }); return 'โรคระบาดในวัวนม ราคานมสดนำเข้า +40% อีก 2 เดือน ฟาร์มโคนมของตัวเองได้เปรียบ'; } },
    { w:2, tone:'bad', when: m => m >= 0 && m <= 2, make: s => { s.mods.push({ kind:'demand', key:'all', mult:.88, left:1 }); return 'ฝุ่น PM2.5 คลุมเมือง คนออกมาซื้อของน้อยลงเดือนหน้า'; } },
    { w:2, tone:'good', make: (s, r) => { const p = CONSUMER[Math.floor(r() * CONSUMER.length)]; s.mods.push({ kind:'demand', key:p, mult:1.25, left:2 }); return `${P[p].name}กำลังเป็นกระแสในโซเชียล ความต้องการ +25% อีก 2 เดือน`; } },
    { w:2, tone:'good', make: (s, r) => { const p = CONSUMER[Math.floor(r() * CONSUMER.length)]; s.mods.push({ kind:'port', key:p, mult:.85, left:2 }); return `ค่าเงินบาทแข็ง ${P[p].name}นำเข้าถูกลง 15% อีก 2 เดือน`; } },
    { w:1, tone:'good', make: s => { s.pop *= 1.04; return 'มหาวิทยาลัยใหม่เปิดรับนักศึกษา ประชากรเมืองเพิ่ม 4%'; } },
  ];
  const SEASON_NEWS = { 2:'หน้าร้อนเริ่มแล้ว เครื่องดื่มขายดีขึ้นถึงพฤษภาคม', 5:'เข้าหน้าฝน ยอดเครื่องดื่มลดลงเล็กน้อย', 10:'เทศกาลยี่เป็งและไฮซีซั่น นักท่องเที่ยวเต็มเมือง' };
  function events(state, rng) {
    const m = dateOf(state.day).getUTCMonth();
    if (SEASON_NEWS[m]) news(state, SEASON_NEWS[m]);
    if (rng() > .4) return;
    const pool = EVENTS.filter(e => !e.when || e.when(m));
    let r = rng() * pool.reduce((a, e) => a + e.w, 0);
    const e = pool.find(e => (r -= e.w) < 0) || pool[0];
    news(state, e.make(state, rng), e.tone);
  }

  // ---- AI rivals: import goods, price against you, open stores at the best free sites ----
  function bestSites(state, type) {
    const out = [];
    for (let y = 0; y < H - 1; y++) for (let x = 0; x < W - 1; x++) if (!canBuild(state, type, x, y)) out.push({ x, y, v: firmValue({ x, y }) });
    return out.sort((a, b) => b.v - a.v);
  }
  function storeSpec(c, products) {
    const spec = [];
    products.forEach(p => spec.push({ type:'purchase', product:p, src:'port' }, { type:'sales', product:p, price: Math.round(P[p].ref * c.priceK) }));
    spec.push({ type:'ad', product: products[0], level: c.adLevel });
    return spec;
  }
  function ai(state, rng) {
    const you = comp(state, 'you');
    for (const c of state.companies.filter(c => c.ai)) {
      const mine = state.firms.filter(f => f.owner === c.id);
      for (const f of mine) for (const u of units(f)) if (u.type === 'sales') {
        const p = u.product, floor = Math.ceil(portPrice(state, p, c) * 1.12);
        const tot = state.marketLast[p].sold || 1, ys = (you.soldLast[p] || 0) / tot;
        const target = P[p].ref * c.priceK;
        if (c.ai === 'cheap' && ys > .2) u.price = Math.max(floor, Math.round(u.price * .96));
        else u.price = Math.max(floor, Math.round(u.price + (target - u.price) * .3));
        if (c.cash > 3e6 && u.level < 6 && u.last >= unitCap(u) * .9) { u.level++; f.invested += CFG.upgrade; book(state, c, 'capex', CFG.upgrade * u.level); }
      }
      if (c.ai === 'premium') for (const p of CONSUMER) c.tech[p] += .5;
      if (c.cash < 0 && mine.length) {
        const pl = f => { const m = f.last || f.mtd; return m.rev - m.cost; };
        const worst = mine.sort((a, b) => pl(a) - pl(b))[0];
        sellFirm(state, worst.id, true);
        news(state, `${c.name} ปิด${FIRMS[worst.type].name}ที่ขาดทุน`, 'good');
      } else if (c.cash > 1.5e6 && rng() < .45 && mine.length < 14) {
        const site = bestSites(state, 'store')[Math.floor(rng() * 3)];
        if (site) {
          const n = 2 + Math.floor(rng() * 2), ps = [...CONSUMER].sort(() => rng() - .5).slice(0, n);
          placeFirm(state, c.id, 'store', site.x, site.y, storeSpec(c, ps));
          news(state, `${c.name} เปิดร้านค้าปลีกสาขาใหม่ ขาย${ps.map(p => P[p].name).join(' ')}`, 'bad');
        }
      }
    }
  }

  function sellFirm(state, id, quiet) {
    const f = state.firms.find(x => x.id === id); if (!f) return false;
    const c = comp(state, f.owner);
    c.cash += f.invested * CFG.sellBack;
    state.firms = state.firms.filter(x => x !== f);
    for (const g of state.firms) for (const u of units(g)) if (u.src === id) u.src = 'port';
    if (!quiet) news(state, `คุณขาย${FIRMS[f.type].name} #${f.id} ได้เงินคืน ฿${Math.round(f.invested * CFG.sellBack).toLocaleString('th-TH')}`);
    return true;
  }

  const news = (state, text, tone = 'info') => { state.news.unshift({ day: state.day, text, tone }); state.news.length = Math.min(state.news.length, 80); };
  const freshMarket = () => Object.fromEntries(CONSUMER.map(p => [p, { demand:0, sold:0 }]));
  const rngOf = state => () => {
    let t = state.seed = (state.seed + 0x6D2B79F5) | 0;
    t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  function newGame(seed = Math.floor(Math.random() * 1e9)) {
    const zero = v => Object.fromEntries(CONSUMER.map(p => [p, v]));
    const company = (id, name, cash, extra) => ({ id, name, cash, loan:0, tech: zero(30), brand: zero(5), mtd: newMtd(), last:null, sold:{}, soldLast:{}, ...extra });
    const state = {
      v:2, seed, day:0, pop:1, nextId:1, firms:[], mods:[], news:[], history:[], over:null,
      market: freshMarket(), marketLast: freshMarket(),
      companies: [
        company('you', 'บริษัทของคุณ', CFG.startCash),
        company('thukdee', 'ถูกดีกรุ๊ป', 6e6, { ai:'cheap', priceK:.9, adLevel:2, importMult:.85, brand: zero(25) }),
        company('luna', 'ลูน่า คอร์ปอเรชั่น', 8e6, { ai:'premium', priceK:1.2, adLevel:5, importMult:1.1, importQ:62, brand: zero(35), tech: zero(45) }),
      ],
    };
    state.port = { x:1, y:16 }; // import depot (decorative, not a firm)
    state.firms.push({ id:0, owner:'port', type:'port', x:1, y:16, units:[], inv:{}, invested:0, mtd:{rev:0,cost:0}, last:null });
    const sites = bestSites(state, 'store');
    const take = i => { const s = sites[i]; sites.splice(i, 1); return s; };
    const y0 = take(4);
    placeFirm(state, 'you', 'store', y0.x, y0.y, [
      { type:'purchase', product:'coffee' }, { type:'sales', product:'coffee', price:25 },
      { type:'purchase', product:'thaitea' }, { type:'sales', product:'thaitea', price:20 },
    ]);
    const th = comp(state, 'thukdee'), lu = comp(state, 'luna');
    const spots = () => bestSites(state, 'store');
    [[th, ['coffee','thaitea']], [lu, ['coffee','bread']], [th, ['bread','thaitea']], [lu, ['thaitea','coffee']], [th, ['coffee','bread']]]
      .forEach(([c, ps], i) => { const s = spots()[i * 2 + 1]; placeFirm(state, c.id, 'store', s.x, s.y, storeSpec(c, ps)); });
    for (const c of state.companies) { c.mtd = newMtd(); c.cash = c.id === 'you' ? CFG.startCash : c.cash; }
    state.history.push({ day:0, nw: state.companies.map(c => Math.round(netWorth(state, c))), cash: CFG.startCash, net:0 });
    news(state, 'คุณมีร้านค้าปลีก 1 แห่ง ขายกาแฟกระป๋องและชาไทยขวดที่ซื้อจากคลังนำเข้า และมีเงินสด ฿5 ล้าน กด ▶ เพื่อเริ่มเดินเวลา');
    return state;
  }

  // ---- player actions ----
  const you = s => comp(s, 'you');
  function build(state, type, x, y) {
    if (state.over || canBuild(state, type, x, y)) return null;
    const cost = buildCost(type, x, y);
    if (you(state).cash < cost) return null;
    const f = placeFirm(state, 'you', type, x, y);
    news(state, `คุณสร้าง${FIRMS[type].name} #${f.id} (฿${cost.toLocaleString('th-TH')})`, 'good');
    return f;
  }
  function addUnit(state, f, slot, type) {
    if (state.over || f.owner !== 'you' || f.units[slot] || !FIRMS[f.type].units.includes(type) || you(state).cash < CFG.unitSetup) return false;
    setUnit(state, f, slot, { type });
    return true;
  }
  function upgradeUnit(state, f, slot) {
    const u = f.units[slot], cost = CFG.upgrade * (u ? u.level : 0);
    if (state.over || !u || u.level >= CFG.maxLevel || you(state).cash < cost) return false;
    u.level++; f.invested += cost; book(state, you(state), 'capex', cost); return true;
  }
  function removeUnit(state, f, slot) { if (!f.units[slot]) return false; f.units[slot] = null; return true; }
  // quick setups fill empty slots the way a Capitalism player would wire them by hand
  function template(state, f, kind, p) {
    const free = () => f.units.findIndex(u => !u);
    const need = [];
    const srcFor = q => (sourcesFor(state, 'you', q)[0] || { id:'port' }).id;
    if (kind === 'sell') need.push({ type:'purchase', product:p, src: srcFor(p) }, { type:'sales', product:p, price:P[p].ref });
    if (kind === 'make') { Object.keys(P[p].recipe).forEach(i => need.push({ type:'purchase', product:i, src: srcFor(i) })); need.push({ type:'make', product:p }); }
    if (kind === 'grow') need.push({ type:'grow', product:p });
    if (kind === 'ad') need.push({ type:'ad', product:p });
    if (kind === 'research') need.push({ type:'research', product:p });
    if (f.units.filter(u => !u).length < need.length) return 'ช่องว่างไม่พอ';
    if (you(state).cash < need.length * CFG.unitSetup) return 'เงินสดไม่พอ';
    need.forEach(u => setUnit(state, f, free(), u));
    return null;
  }
  // point every own store's purchasing of p at this producer
  function linkStores(state, f, p) {
    let n = 0;
    for (const g of state.firms) if (g.owner === 'you' && g !== f && (g.type === 'store' || g.type === 'factory'))
      for (const u of g.units) if (u && u.type === 'purchase' && u.product === p && u.src !== f.id) { u.src = f.id; n++; }
    return n;
  }
  function borrow(state, amt) { const c = you(state); amt = Math.min(amt, CFG.loanLimit - c.loan); if (state.over || amt <= 0) return false; c.loan += amt; c.cash += amt; return true; }
  function repay(state, amt) { const c = you(state); amt = Math.min(amt, c.loan, c.cash); if (state.over || amt <= 0) return false; c.loan -= amt; c.cash -= amt; return true; }
  function tick(state) { if (!state.over) day(state, rngOf(state)); return state; }

  return { W, H, CFG, P, RAW, CONSUMER, FIRMS, UNITS, TILES, newGame, tick, canBuild, buildCost, landCost, firmAt, firmValue,

  }

}
function onClick(e) {

function unitLinks(f) {

}
function drawLinks(f) {

  const box = el.parentElement.getBoundingClientRect(), tiles = el.parentElement.querySelectorAll('.u');
  const c = i => { const r = tiles[i].getBoundingClientRect(); return [r.left - box.left + r.width / 2, r.top - box.top + r.height / 2]; };
  const rad = tiles[0] ? tiles[0].getBoundingClientRect().width * .42 : 40;

    + unitLinks(f).map(([a, b]) => { const [x1, y1] = c(a), [x2, y2] = c(b), d = Math.hypot(x2 - x1, y2 - y1), k = rad / d;
      return `<line x1="${x1 + (x2 - x1) * k}" y1="${y1 + (y2 - y1) * k}" x2="${x2 - (x2 - x1) * k}" y2="${y2 - (y2 - y1) * k}" stroke="#e8b64c" stroke-width="3" stroke-opacity=".9" marker-end="url(#ar)"/>`; }).join('');

      <tr><td><b>กำไรสุทธิ</b></td><td class="num ${net(m) >= 0 ? 'pos' : 'neg'}"><b>${signed(net(m))}</b></td><td class="num ${has ? (L.net >= 0 ? 'pos' : 'neg') : ''}"><b>${has ? signed(L.net) : '—'}</b></td></tr>
      <tr><td class="muted">ลงทุนอาคารและหน่วย</td><td class="num muted">${fmt(m.capex)}</td><td class="num muted">${has ? fmt(L.capex) : '—'}</td></tr>

    <div class="sec"><h3>ธนาคาร</h3><div class="msg inset">ดอกเบี้ย 0.6%/เดือน · วงเงิน ฿10 ล้าน · หนี้ตอนนี้ ${baht(c.loan)}</div>
    <div class="row"><button class="bt" data-act="borrow">กู้ ฿1,000,000</button><button class="bt" data-act="repay" ${c.loan <= 0 ? 'disabled' : ''}>คืนหนี้ ฿1,000,000</button></div></div>
  </div><div><h3>มูลค่าบริษัทรายเดือน</h3><div class="inset" style="padding:6px"><canvas class="chart" id="chart"></canvas></div>
    <div class="row" style="margin-top:6px;font-size:.74rem">${state.companies.map(x => `<span><i class="dotc" style="background:var(${COLOR[x.id]})"></i>${esc(x.name)}</span>`).join(' ')}</div></div></div>`;
}
function winMkt() {
  const c = you(), ML = state.marketLast, MM = state.market;
  return `<h3>สินค้าอุปโภคบริโภค</h3><div class="tw inset"><table><thead><tr><th>สินค้า</th><th>ความต้องการ/วัน</th><th>ราคาอ้างอิง</th><th>ส่วนแบ่งคุณ</th>${state.companies.slice(1).map(x => `<th>${esc(x.name)}</th>`).join('')}<th>เทคโนฯ</th><th>แบรนด์</th></tr></thead><tbody>
    ${Sim.CONSUMER.map(p => {
      const src = ML[p].sold ? { m:ML[p], key:'soldLast' } : { m:MM[p], key:'sold' };
      const sh = id => src.m.sold ? `${Math.round((Sim.comp(state, id)[src.key][p] || 0) / src.m.sold * 100)}%` : '—';
      return `<tr><td>${chip(p)} ${Sim.P[p].name}</td><td class="num">${fmt(Sim.demand(state, p))}</td><td class="num">฿${Sim.P[p].ref}</td><td class="num"><b>${sh('you')}</b></td>${state.companies.slice(1).map(x => `<td class="num">${sh(x.id)}</td>`).join('')}<td class="num">${Math.round(c.tech[p])}</td><td class="num">${Math.round(c.brand[p])}</td></tr>`;
    }).join('')}</tbody></table></div>
    <div class="sec"><h3>ราคาที่คลังนำเข้า</h3><div class="tw inset"><table><thead><tr><th>สินค้า</th><th>ราคา</th><th>คุณภาพ</th><th>ใช้ผลิต</th></tr></thead><tbody>
    ${[...Sim.RAW, ...Sim.CONSUMER].map(p => `<tr><td>${chip(p)} ${Sim.P[p].name}</td><td class="num">฿${Sim.portPrice(state, p, c).toFixed(2)}</td><td class="num">${Sim.P[p].q}</td><td>${Sim.CONSUMER.filter(x => Sim.P[x].recipe[p]).map(x => Sim.P[x].name).join(', ') || (Sim.P[p].kind === 'consumer' ? 'สินค้าสำเร็จรูป' : '')}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}
function winRank() {
  const rows = state.companies.map(x => ({ x, nw: Sim.netWorth(state, x), n: state.firms.filter(f => f.owner === x.id).length })).sort((a, b) => b.nw - a.nw);
  return `<div class="tw inset"><table><thead><tr><th>#</th><th style="text-align:left">บริษัท</th><th>มูลค่า</th><th>เงินสด</th><th>อาคาร</th><th>กำไรเดือนก่อน</th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr><td class="num">${i + 1}</td><td style="text-align:left"><i class="dotc" style="background:var(${COLOR[r.x.id]})"></i>${esc(r.x.name)}</td><td class="num">${baht(r.nw)}</td><td class="num">${baht(r.x.cash)}</td><td class="num">${r.n}</td><td class="num ${r.x.last ? (r.x.last.net >= 0 ? 'pos' : 'neg') : ''}">${r.x.last ? signed(r.x.last.net) : '—'}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="sec"><div class="msg inset">ถูกดีกรุ๊ปขายถูกและตัดราคาเมื่อคุณแย่งลูกค้าได้มาก · ลูน่า คอร์ปอเรชั่นนำเข้าสินค้าพรีเมียม คุณภาพสูง แบรนด์แข็ง</div></div>`;
}
const winNews = () => `<ol id="news">${state.news.map(n => `<li class="${n.tone}"><time>${Sim.dateLabel(n.day)}</time><span>${esc(n.text)}</span></li>`).join('')}</ol>`;
const winHelp = () => `<div class="help">
  <h3>เป้าหมาย</h3><p>สร้างมูลค่าบริษัทให้ถึง <b>฿${million(Sim.CFG.goal)}</b> ภายใน 3 ปี แข่งกับบริษัท AI สองราย</p>
  <h3>การควบคุม</h3><ul><li>ลากแผนที่เพื่อเลื่อน ปุ่ม + − มุมซ้ายล่างเพื่อซูม</li><li>เลือกอาคารจากแถบเครื่องมือ แล้วคลิกที่ดินว่างเพื่อสร้าง</li><li>คลิกอาคารเพื่อเปิดหน้าจอจัดการแบบตาราง 3×3</li><li>ปุ่ม ❚❚ ▶ ▶▶ ▶▶▶ ด้านบนควบคุมเวลา</li></ul>
  <h3>อาคารและหน่วย</h3><ul><li><b>ร้านค้าปลีก</b>: จัดซื้อ → ขายปลีก, โฆษณา</li><li><b>โรงงาน</b>: จัดซื้อวัตถุดิบ → ผลิต (นอกใจกลางเมือง)</li><li><b>ฟาร์ม</b>: เพาะปลูก/เลี้ยงสัตว์ (เขตชนบท)</li><li><b>ศูนย์วิจัย</b>: เพิ่มเทคโนโลยีให้สินค้าคุณภาพสูงขึ้น</li></ul>
  <h3>เคล็ดลับ</h3><ul><li>ผลิตเองถูกกว่าซื้อสินค้าสำเร็จรูปนำเข้าเกือบครึ่ง</li><li>ฟาร์มของตัวเองทำให้ต้นทุนวัตถุดิบต่ำและคุณภาพสูงขึ้นเมื่ออัปเกรด</li><li>เครื่องหมาย ! สีแดงบนอาคารแปลว่ามีหน่วยต้องดูแล</li><li>เกมบันทึกอัตโนมัติในเบราว์เซอร์นี้</li></ul>
  <div class="row"><button class="bt danger" data-act="newgame">เริ่มเกมใหม่</button></div></div>`;

function drawChart() {
  const c = $('#chart'); if (!c) return;
  const w = c.clientWidth, h = c.clientHeight, dpr = window.devicePixelRatio || 1; if (!w) return;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const Hs = state.history, N = Sim.CFG.days, G = Sim.CFG.goal, vals = Hs.flatMap(p => p.nw);
  const lo = Math.min(0, ...vals), hi = Math.max(G, ...vals) * 1.05;
  const st = [2e6, 5e6, 1e7, 2e7, 5e7].find(s => (hi - lo) / s <= 6) || 1e8;
  const L = 38, R = 8, T = 8, B = 20, x = d => L + (w - L - R) * d / N, y = v => T + (h - T - B) * (1 - (v - lo) / (hi - lo));
  g.font = '11px "IBM Plex Mono", monospace'; g.textBaseline = 'middle';
  for (let v = Math.ceil(lo / st) * st; v <= hi; v += st) { g.strokeStyle = css('--line'); g.beginPath(); g.moveTo(L, y(v)); g.lineTo(w - R, y(v)); g.stroke(); g.fillStyle = css('--muted'); g.textAlign = 'right'; g.fillText(v / 1e6 + 'M', L - 5, y(v)); }
  g.textAlign = 'center';
  for (let yr = 0; yr <= 3; yr++) g.fillText(yr < 3 ? String(Sim.CFG.startYear + 543 + yr) : 'จบ', Math.min(Math.max(x(yr * 365), L + 14), w - R - 14), h - 8);
  g.setLineDash([4, 4]); g.strokeStyle = css('--gold'); g.beginPath(); g.moveTo(L, y(G)); g.lineTo(w - R, y(G)); g.stroke(); g.setLineDash([]);
  state.companies.forEach((co, i) => {
    g.strokeStyle = css(COLOR[co.id]); g.lineWidth = co.id === 'you' ? 2.5 : 1.5; g.beginPath();
    Hs.forEach((p, k) => k ? g.lineTo(x(p.day), y(p.nw[i])) : g.moveTo(x(p.day), y(p.nw[i]))); g.stroke();
    const e = Hs[Hs.length - 1]; g.fillStyle = g.strokeStyle; g.beginPath(); g.arc(x(e.day), y(e.nw[i]), 3, 0, 7); g.fill();
  });
}

// ---- loop ----
function winBusy() { const a = document.activeElement; return a && (a.tagName === 'SELECT' || a.tagName === 'INPUT') && a.closest('#win'); }
function renderAll() { renderTop(); renderDock(); drawMap(); renderWin(); status(); }
function changed() { renderAll(); save(); }
function setSpeed(s) {
  ui.speed = state.over ? 0 : s; clearInterval(timer); timer = null;
  if (ui.speed) timer = setInterval(() => {
    const before = state.day;
    Sim.tick(state);
    renderTop(); drawMap();
    const turned = Sim.dateOf(state.day).getUTCDate() === 1;
    if (!winBusy() && ui.win && ui.win !== 'help' && (turned || state.day % 3 === 0)) renderWin();
    if (state.day % 5 === 0 || turned) status();
    if (turned) { save(); const l = you().last; if (l) toast(`ปิดงบ ${Sim.monthLabel(before)}: ${l.net >= 0 ? 'กำไร' : 'ขาดทุน'} ${signed(l.net)}`); }
    if (state.over) { setSpeed(0); save(); showOver(); renderAll(); }
  }, SPEED_MS[ui.speed]);
  renderTop();
}
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }
function showOver() {
  if (!state.over) return;
  const nw = Sim.netWorth(state, you());
  const [t, b] = { win:['คุณคือเจ้าสัวแห่งเชียงใหม่', `มูลค่าบริษัทถึง ${baht(nw)} เมื่อ ${Sim.dateLabel(state.day)}`],
    bankrupt:['ล้มละลาย', 'เงินสดติดลบเกินวงเงินกู้ ธนาคารยึดกิจการ'],
    timeup:['ครบ 3 ปี', `มูลค่าบริษัทสุดท้าย ${baht(nw)} (${Math.round(nw / Sim.CFG.goal * 100)}% ของเป้า)`] }[state.over.kind];
  $('#ov-t').textContent = t; $('#ov-b').textContent = b; $('#overlay').hidden = false;
}
function newGame() { setSpeed(0); state = Sim.newGame(); ui.sel = null; ui.slot = null; ui.build = null; closeWin(); $('#overlay').hidden = true; changed(); centerOn(12.5, 8); toast('เริ่มเกมใหม่แล้ว'); }

function init() {
  document.querySelector('.speed').onclick = e => { const b = e.target.closest('[data-speed]'); if (b) setSpeed(+b.dataset.speed); };
  $('#dock').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.build) { ui.build = ui.build === b.dataset.build ? null : b.dataset.build; ui.hover = null; map.classList.toggle('building', !!ui.build); if (ui.build && innerWidth <= 760) closeWin(); renderDock(); status(); drawMap(); return; }
    if (b.dataset.open) { if (ui.win === b.dataset.open) closeWin(); else openWin(b.dataset.open); }
  };
  // drag to pan, click to act
  let drag = null;
  map.addEventListener('pointerdown', e => { drag = { x:e.clientX, y:e.clientY, sl:vp.scrollLeft, st:vp.scrollTop, moved:false }; map.setPointerCapture(e.pointerId); });
  map.addEventListener('pointermove', e => {
    if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 5) drag.moved = true; if (drag.moved) { vp.scrollLeft = drag.sl - dx; vp.scrollTop = drag.st - dy; return; } }
    if (e.pointerType === 'mouse') onHover(e);
  });
  map.addEventListener('pointerup', e => { const d = drag; drag = null; if (d && !d.moved) { if (e.pointerType !== 'mouse') onHover(e); onClick(e); } });
  map.addEventListener('pointerleave', () => { if (!drag) { ui.hover = null; status(); drawMap(); } });
  $('#zin').onclick = () => setZoom(ui.zoom + 1); $('#zout').onclick = () => setZoom(ui.zoom - 1);
  $('#win-x').onclick = closeWin;
  addEventListener('keydown', e => { if (e.key === 'Escape') { if (ui.build) { ui.build = null; map.classList.remove('building'); renderDock(); status(); drawMap(); } else if (ui.win) closeWin(); } });
  $('#win-b').addEventListener('click', e => {
    const f = selFirm(), b = e.target.closest('button'); if (!b) return;
    if (b.dataset.pick) return openFirm(+b.dataset.pick);
    if (b.dataset.slot != null) { ui.slot = ui.slot === +b.dataset.slot ? null : +b.dataset.slot; renderWin(); return; }
    if (b.dataset.add) { if (Sim.addUnit(state, f, ui.slot, b.dataset.add)) changed(); return; }
    if (b.dataset.tpl) { const [k, p] = b.dataset.tpl.split(':'); const err = Sim.template(state, f, k, p); if (err) toast(err); else { ui.slot = null; changed(); } return; }
    const act = b.dataset.act;
    if (act === 'up' && Sim.upgradeUnit(state, f, ui.slot)) changed();
    if (act === 'rm' && Sim.removeUnit(state, f, ui.slot)) { ui.slot = null; changed(); }
    if (act === 'link') { const n = Sim.linkStores(state, f, f.units[ui.slot].product); toast(n ? `เปลี่ยนแหล่งซื้อแล้ว ${n} หน่วย` : 'ยังไม่มีหน่วยจัดซื้อสินค้านี้ในอาคารอื่น'); changed(); }
    if (act === 'sell') { if (b.dataset.armed) { Sim.sellFirm(state, f.id); closeWin(); changed(); } else { b.dataset.armed = 1; b.textContent = 'กดอีกครั้งเพื่อยืนยันการขาย'; } }
    if (act === 'borrow' && Sim.borrow(state, 1e6)) changed();
    if (act === 'repay' && Sim.repay(state, 1e6)) changed();
    if (act === 'newgame') { if (b.dataset.armed) newGame(); else { b.dataset.armed = 1; b.textContent = 'กดอีกครั้งเพื่อยืนยัน'; } }
  });
  $('#win-b').addEventListener('change', e => {
    const f = selFirm(), u = f && f.units[ui.slot]; if (!u) return;
    if (e.target.id === 'u-prod') { u.product = e.target.value || null; if (u.type === 'sales' && u.product) u.price = Sim.P[u.product].ref; u.src = 'port'; }
    if (e.target.id === 'u-src') u.src = e.target.value === 'port' ? 'port' : +e.target.value;
    if (e.target.id === 'u-price') u.price = Math.max(1, Math.round(+e.target.value || 1));
    e.target.blur(); changed();
  });
  $('#ov-new').onclick = newGame;
  $('#ov-close').onclick = () => { $('#overlay').hidden = true; };
  addEventListener('resize', () => { drawChart(); const f = selFirm(); if (f && ui.win === 'firm') drawLinks(f); });
  if (document.fonts) document.fonts.ready.then(() => { groundKey = ''; drawMap(); });
  if (innerWidth <= 760) ui.zoom = 0;
  sizeMap(); renderAll(); centerOn(12.5, 8); showOver();
}

window.claude?.hot?.snapshot?.(() => ({ state, ui: { ...ui, speed:0 } }));
const start = data => {
  state = data?.state || load() || Sim.newGame();
  if (data?.ui) ui = { ...ui, ...data.ui, speed:0 };
  init();
  if (ui.win) { $('#win').hidden = false; renderWin(); }
};
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
